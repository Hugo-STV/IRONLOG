}
@media (prefers-color-scheme: dark){

  }
}
:root[data-theme="dark"]{

  --accent:#5b93ec; --accent-ink:#0b1424; --accent-soft:#1c2c46;
  --p-blue:#3d7ae0; --p-white:#d8dce1; --steel:#9aa3ae; --done:#15281d; --done-line:#2d5c3e; --danger:#ec6a5f; --over:#3a1d1a; --sil:#39404a; --reg:#4c5561; --hl:#e9eef5; --tile:#1d222a; --gold1:#fff1b8; --gold2:#f2c14e; --gold3:#b07a14; --amb:#f2b23e; --amb-bg:#3a2e16; --amb-ln:#7a5a1e; --grn:#4fd18b; --grn-bg:#173326; --grn-ln:#2d6a4a; --vio:#a88bff; --vio-bg:#2a2445; --vio-ln:#54468f; --accent-tint:#1f3556;

:root[data-skin="peak"]{--bg:#0a0c18; --surface:#121528; --raised:#1a1e37; --ink:#eef0ff; --muted:#949ac4; --line:#262b4c; --accent:#5b6cff; --accent-ink:#ffffff; --accent-soft:#1d2250; --accent-tint:#262d66; --done:#122b2a; --done-line:#22605a; --danger:#ff6b7d; --over:#3b1a2a; --tile:#1a1e37}
:root[data-skin="peak"] .tabs a.on,:root[data-skin="peak"] .heyebrow{color:#5fb4ff}
:root[data-skin="peak"] .btn.primary{background:linear-gradient(100deg,#13a6ff,#6a3df0);border-color:transparent}
:root[data-skin="gold"]{--bg:#0b0a08; --surface:#15130f; --raised:#1d1a14; --ink:#f5eedb; --muted:#a89d84; --line:#2f2a20; --accent:#e4b33d; --accent-ink:#1a1205; --accent-soft:#2a2313; --accent-tint:#3a2f14; --done:#1c2716; --done-line:#3b5527; --danger:#ef5b4c; --over:#3a1a15; --tile:#1d1a14}
:root[data-skin="blood"]{--bg:#0c0808; --surface:#160f0f; --raised:#1f1515; --ink:#f7eae8; --muted:#ad8f8b; --line:#352120; --accent:#e3342e; --accent-ink:#ffffff; --accent-soft:#3a1512; --accent-tint:#4c1a16; --done:#1b2617; --done-line:#3a5228; --danger:#ff7a6e; --over:#40191a; --tile:#1f1515}
:root[data-skin="venom"]{--bg:#060a07; --surface:#0e1510; --raised:#141f17; --ink:#e6f6ea; --muted:#86a58e; --line:#21342a; --accent:#44e283; --accent-ink:#03140a; --accent-soft:#123020; --accent-tint:#174128; --done:#13301f; --done-line:#2b6a44; --danger:#ff6b5e; --over:#3a1a17; --tile:#141f17}
:root[data-skin="neon"]{--bg:#0b0716; --surface:#140e25; --raised:#1c1532; --ink:#f1ebff; --muted:#9d91c4; --line:#2d2449; --accent:#ff3fd2; --accent-ink:#22001b; --accent-soft:#3a1440; --accent-tint:#4a1752; --done:#16283a; --done-line:#2a5677; --danger:#ff6b7a; --over:#3d1630; --tile:#1c1532}
:root[data-skin="steel"]{--bg:#0e1115; --surface:#161a20; --raised:#1d222a; --ink:#e7ebf0; --muted:#8c96a4; --line:#29303a; --accent:#5b93ec; --accent-ink:#0b1424; --accent-soft:#1c2c46; --accent-tint:#1f3556; --done:#15281d; --done-line:#2d5c3e; --danger:#ec6a5f; --over:#3a1d1a; --tile:#1d222a}
:root[data-skin="chalk"]{--bg:#f3efe6; --surface:#fffdf8; --raised:#f2ede2; --ink:#1c1a16; --muted:#6c665a; --line:#ded6c6; --accent:#c2410c; --accent-ink:#ffffff; --accent-soft:#fbe4d5; --accent-tint:#f8dac6; --done:#e4f1e2; --done-line:#a6cfa1; --danger:#b42318; --over:#f6d9d3; --tile:#f2ede2; --sil:#c9c2b3; --reg:#b3aa98; --hl:#c2410c; --amb:#a35f00; --amb-bg:#fbefd9; --amb-ln:#ecc27a; --grn:#1d7a45; --grn-bg:#e2f2e6; --grn-ln:#98cfa9; --vio:#6a43c9; --vio-bg:#ece6fb; --vio-ln:#bfaaf0; --gold1:#d9a429; --gold2:#a8740f; --gold3:#6e4a07; color-scheme:light}
:root[data-skin="neon"][data-skin]:not([data-skin="chalk"]){--gold1:#ffd1f5; --gold2:#ff3fd2; --gold3:#8f3dff}
:root[data-skin="venom"] .brand .wm,:root[data-skin="blood"] .brand .wm{filter:drop-shadow(0 0 6px rgba(0,0,0,.4))}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none}
.brand .bm{height:40px;width:auto;margin:-6px 0 -4px -2px;filter:drop-shadow(0 2px 6px rgba(60,90,255,.25))}
.brand .bw{height:19px;width:auto}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{font:800 27px/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.brand svg{width:38px;height:38px;flex:none;margin:-6px 0 -6px -4px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.brand .wm{background:linear-gradient(180deg,var(--gold1) 0%,var(--gold2) 52%,var(--gold3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic;padding-right:.08em;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.top .sp{flex:1}
.live{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:5px 12px;font:600 13px var(--f-mono);text-decoration:none}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);text-decoration:none;padding:0;flex:none}
.iconbtn svg{width:18px;height:18px}
.unit{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);flex:none}
.unit button{border:0;background:none;padding:7px 10px;font:600 12.5px var(--f-mono)}
.unit button.on{background:var(--ink);color:var(--bg)}

/* type */
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font:700 34px/1.05 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
.h2{font:700 21px/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.label{font:600 11px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
section.block{display:grid;gap:12px;margin-top:26px}
.row-between{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--accent);font-weight:600;font-size:14px;text-decoration:none}
.big-start{min-height:56px;font:700 20px var(--f-display);letter-spacing:.06em;text-transform:uppercase}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stats>div{background:var(--surface);padding:12px 14px;min-width:0}
.stats b{display:block;font:600 22px/1.15 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats b small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:16px}
.banner p{margin:0;flex:1 1 240px}
.next{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.next .v{font:600 24px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.next .v.up{color:var(--p-green)}
.next .v.down{color:var(--danger)}

/* routine cards */
.wiz{display:grid;gap:16px;margin-top:18px}
.wiz .q{font:700 30px/1.08 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
.dots{display:flex;gap:5px}.dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}.dots i.on{background:var(--accent)}
.wtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wtiles.three{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.wtile{display:grid;gap:4px;align-content:center;justify-items:center;text-align:center;min-height:96px;padding:14px 10px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.wtile b{font:700 26px/1 var(--f-display);letter-spacing:.02em}
.wtile span{font-size:13.5px;color:var(--muted);line-height:1.35}
.wtile.text b{font:700 19px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.wtile.on{border-color:var(--accent);background:var(--accent-soft)}
.wtile .mth{width:56px;height:56px;border:0;background:none}
.wtile.big{justify-items:start;text-align:left;min-height:0;padding:18px}
.wtile.big ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px;text-align:left}
.wnav{display:flex;gap:8px;position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px}
.wnav .btn{flex:1;min-height:50px;font-size:16px}
.tgl{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.tgl:checked{background:var(--p-green)}.tgl:checked::after{transform:translateX(18px)}
.streak{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.streak svg{width:40px;height:40px;grid-row:1/3}
.streak b{font:700 26px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.streak .sub{font:500 13px var(--f-mono);color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.wkdots{display:flex;gap:4px;margin-top:6px}.wkdots i{width:10px;height:10px;border-radius:3px;background:var(--raised);border:1px solid var(--line)}.wkdots i.on{background:var(--p-red);border-color:var(--p-red)}
.rirrow{display:flex;gap:5px;align-items:center;padding:0 2px 4px 42px;font:600 11px var(--f-body);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.rirrow button{min-width:32px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:600 12px var(--f-mono);padding:0 6px}
.rirrow button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rirrow button.tg{border-color:var(--accent)}
.phase{display:inline-flex;gap:6px;align-items:center}
.ill{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ill figure{margin:0;position:relative;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line);aspect-ratio:1/1;display:grid;place-items:center;padding:6px}
.ill img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.ill figcaption{position:absolute;left:7px;top:7px;background:rgba(10,14,20,.72);color:#fff;font:600 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.qlw{display:grid;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}
.qlh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.qli{display:flex;gap:10px;align-items:center;padding:4px 0;border-top:1px solid var(--line)}
.qli:first-of-type{border-top:0}
.qli.bad{opacity:.85}
.qlsel{width:100%;border:0;background:transparent;font:600 14px var(--f-body);color:var(--ink);padding:0;margin:0 0 2px -2px;max-width:100%}
#qlocr{background:var(--accent-soft);border-radius:10px;padding:8px 10px}
.lastline{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:7px 8px 7px 12px;margin-top:-2px}
.lastline .lk{font:700 10.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lastline .lv{flex:1;min-width:0;font:600 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.lastline .lv i{font-style:normal;color:var(--muted);margin:0 5px}
.lastline .btn{min-height:30px}
.howpics img,.ill img{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:40;background:#07090c;display:grid;grid-template-rows:auto 1fr auto;padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(10px,env(safe-area-inset-left,0px));touch-action:pan-y pinch-zoom}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;font:600 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px}
.lb-top button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:20px;line-height:1}
.lb-stage{min-height:0;display:grid;place-items:center;position:relative}
.lb-stage img{position:relative;z-index:1;max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;background:#fff;user-select:none;-webkit-user-drag:none}
.lb-nav{position:absolute;z-index:2;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(10,14,20,.55);color:#fff;font-size:22px;line-height:1}
.lb-nav.lb-prev{left:4px}.lb-nav.lb-next{right:4px}
.lb-dots{display:flex;justify-content:center;gap:8px;padding-top:12px}
.lb-dots button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:6px 14px;font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.lb-dots button.on{background:#fff;color:#111}
.howto{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.howpics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.howpics figure{margin:0;position:relative;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line);aspect-ratio:4/3}
.howpics img{width:100%;height:100%;object-fit:contain;display:block}
.howpics figcaption{position:absolute;left:6px;top:6px;background:rgba(10,14,20,.7);color:#fff;font:600 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px;line-height:1.45}
.steps li::marker{font:600 13px var(--f-mono);color:var(--accent)}
.ssgroup{border:1.5px dashed var(--accent);border-radius:16px;padding:8px 8px 4px;margin-top:12px;display:grid}
.ssgroup>.ssh{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);padding:2px 4px}

.sslabel{display:inline-grid;place-items:center;min-width:26px;height:22px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:700 12px var(--f-mono);padding:0 5px;margin-right:6px;vertical-align:2px}
.pickrow{display:flex;align-items:center;border-top:1px solid var(--line)}
.pickrow:first-child{border-top:0}
.pickrow .li{border-top:0;flex:1;min-width:0}
.pickrow .info{margin-right:10px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.mtile{display:grid;justify-items:center;gap:2px;border:1px solid var(--line);background:var(--tile);border-radius:14px;padding:6px 4px 8px;font-weight:600;font-size:12.5px;color:var(--ink)}

.pbar{height:6px;background:var(--raised);border:1px solid var(--line);border-radius:4px;overflow:hidden}

.pgwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.pgrid{border-collapse:collapse;width:100%;min-width:max-content;font-size:13px}
.pgrid th,.pgrid td{padding:6px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}

.pgrid th[scope=row]{text-align:left;padding-left:12px;font:600 13px var(--f-mono)}

.pgrid tr.deload{background:color-mix(in srgb,var(--p-yellow) 7%,transparent)}
.cell{min-width:64px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--raised);font:600 12px var(--f-mono);color:var(--muted);padding:0 8px}
.cell.done{background:var(--p-green);border-color:var(--p-green);color:#fff}
.cell.skip{background:transparent;border-style:dashed}
.cell.next{background:transparent;border:2px solid var(--accent);color:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 40%,transparent)}
.progcard{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.progcard .big{font:700 26px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.backlink{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:14px;justify-self:start}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;align-content:start}
.rcard h3{font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.rcard ul{margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted);display:grid;gap:2px}
.rcard ul li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .acts{display:flex;gap:8px}
.rcard .acts .btn{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.scrollchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scrollchips::-webkit-scrollbar{display:none}

/* active workout */
.wk-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:4;background:var(--bg);padding-block:12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;border-bottom:1px solid var(--line)}
.wk-name{border:0;background:transparent;font:700 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;padding:0;min-width:0;width:100%}
.wk-meta{grid-column:1;display:flex;gap:14px;font:500 13px var(--f-mono);color:var(--muted);flex-wrap:wrap}
.wk-head .btn{grid-row:1/3;grid-column:2}
.exc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px 10px;margin-top:12px;display:grid;gap:10px}
.exc-h{display:flex;gap:8px;align-items:flex-start}
.exc.col{padding:0;gap:0;margin-top:8px}
.colbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 12px;text-align:left;color:var(--ink);border-radius:14px}
.colbtn .ct{flex:1;min-width:0;display:grid;gap:1px}
.colbtn .ct b{font:700 16px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colbtn .ci{font:500 12.5px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colbtn .chev{color:var(--muted);font-size:14px;flex:none}
.cprog{width:38px;height:6px;border-radius:3px;background:var(--raised);border:1px solid var(--line);overflow:hidden;flex:none}
.cprog i{display:block;height:100%;background:var(--accent)}
.cdone{width:26px;height:26px;border-radius:50%;background:var(--p-green);color:#fff;display:grid;place-items:center;flex:none}
.cdone svg{width:15px;height:15px}
.exc.col.isdone{opacity:.72}
.ssgroup .exc.col{margin-top:6px}
.exc-h>div{flex:1;min-width:0}
.exc-h h3{font:700 19px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.exc-h .sub{font-size:12.5px;color:var(--muted)}
.hint{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:3px 8px;font:600 12.5px var(--f-mono);background:var(--raised);border:1px solid var(--line);color:var(--ink)}
button.pill{cursor:pointer}
.pill.up{background:var(--done);border-color:var(--done-line)}
.pill.down{background:var(--over);border-color:var(--danger)}
.pill.warm{background:transparent;border-color:var(--p-yellow)}
.pill.pr{background:var(--p-red);border-color:var(--p-red);color:#fff}

.sets{display:grid;gap:3px}

.chk{width:38px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--raised);display:grid;place-items:center;padding:0;color:var(--muted)}

.del{border:0;background:none;color:var(--muted);font-size:18px;padding:0;line-height:1}

.bbrow{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:0 2px 4px 42px;text-align:left;color:var(--muted);font:500 11.5px var(--f-mono)}

.bbrow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exc-acts{display:flex;gap:8px}
.exc-acts .btn{flex:1;min-height:36px;font-size:13px}
.add-ex{margin-top:14px}

/* rest bar */
.restbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* lists */
.list{display:grid;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.li{display:flex;gap:12px;align-items:center;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}

.li .r{font:500 12.5px var(--f-mono);color:var(--muted);white-space:nowrap}

.lhead:first-child{border-top:0}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;text-align:left;width:100%}
.wcard .nm{font:700 19px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.wcard .meta{display:flex;gap:14px;flex-wrap:wrap;font:500 13px var(--f-mono);color:var(--muted)}
.wcard .exs{font-size:13.5px;display:grid;gap:1px}
.wcard .exs span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* forms */
.field{display:grid;gap:6px}
.input,select.input,textarea.input{width:100%;min-height:42px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:8px 12px}
textarea.input{min-height:140px;font:12px/1.4 var(--f-mono)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:9px 14px;font-weight:600;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg)}
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.eq{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;font-size:14px}
.eq input{width:17px;height:17px;accent-color:var(--accent)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.setrow:first-of-type{border-top:0}
.setrow .lbl{flex:1 1 200px}
.setrow .lbl b{display:block;font-weight:600}
.setrow .lbl span{font-size:13px;color:var(--muted)}

/* charts */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:320px}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font:500 11px var(--f-mono)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent)}
.chart .endlbl{fill:var(--ink);font-weight:600;font-size:12px}
.chart-empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:12px}
.mbars{display:grid;gap:7px}
.mbar{display:grid;grid-template-columns:92px 1fr 30px;gap:10px;align-items:center;font-size:13px}
.mbar .tr{position:relative;height:14px;background:var(--raised);border-radius:3px;overflow:hidden}
.mbar .zone{position:absolute;top:0;bottom:0;background:var(--done);border-left:1px dashed var(--done-line);border-right:1px dashed var(--done-line)}
.mbar .fill{position:absolute;left:0;top:3px;bottom:3px;background:var(--accent);border-radius:2px}
.mbar b{font:600 13px var(--f-mono);text-align:right}
.heyebrow{font:700 12px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 16px;display:grid;gap:12px}
.hcard h2{font:700 26px/1.1 var(--f-display);letter-spacing:.01em;margin:0}
.hsub{margin:-4px 0 0;color:var(--muted);font-size:14px;line-height:1.45}.hsub b{color:var(--ink)}
.hstack{display:grid;gap:14px}
.bmaps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}.bmaps figure{margin:0;display:grid;justify-items:center;gap:4px}.bmaps figcaption{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bmap{width:100%;max-width:170px;height:auto;display:block}
.bmap polygon{stroke:var(--surface);stroke-width:.6;stroke-linejoin:round}
.bm-x{fill:color-mix(in srgb,var(--muted) 14%,var(--surface))}.bm{cursor:pointer;transition:fill-opacity .2s}
.bm.l0{fill:color-mix(in srgb,var(--muted) 26%,var(--surface))}.bmleg .l0{background:color-mix(in srgb,var(--muted) 26%,var(--surface));opacity:1}
:root{--h1:#3d43a8;--h2:#3f86ff;--h3:#1fd1c1;--h4:#c4f23a}.bm.l1{fill:var(--h1)}.bm.l2{fill:var(--h2)}.bm.l3{fill:var(--h3)}.bm.l4{fill:var(--h4)}
.bm:hover{stroke:var(--ink)}
.bmleg{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;font-size:12px;color:var(--muted)}.bmleg span{display:flex;align-items:center;gap:5px}.bmleg i{width:12px;height:12px;border-radius:3px;background:var(--accent)}
.bmleg .l1{background:var(--h1)}.bmleg .l2{background:var(--h2)}.bmleg .l3{background:var(--h3)}.bmleg .l4{background:var(--h4)}
.li.nxt{align-items:center}.nx-t{flex:1;min-width:0}.nx-t .t2{white-space:normal}.li.nxt .r{flex:none;font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--raised)}
.radar{position:relative;width:100%;max-width:340px;margin:4px auto;aspect-ratio:1}.radar>svg{position:absolute;inset:0;width:100%;height:100%}
.bal-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.seg.sm button{padding:6px 11px;font-size:12.5px}
.seg.sm button.on{background:var(--accent);color:#fff}
.ftabs{display:flex;flex:none;margin:0}.ftabs button{flex:1}
.radar2{width:100%;max-width:400px;margin:0 auto}.radar2 svg{display:block;width:100%;height:auto;overflow:visible}
.rd-l{font:600 4.3px var(--f-body,system-ui);fill:var(--muted)}.rd-n{font:700 4.3px var(--f-mono);fill:var(--ink)}
.bl-h{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px}
.bl-leg{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin:-4px 0 2px}.bl-leg i{width:12px;height:12px;border-radius:3px;background:color-mix(in srgb,var(--p-green) 30%,transparent);border:1px solid var(--p-green)}
.bl-r{display:grid;grid-template-columns:18px minmax(80px,30%) 1fr 34px;gap:10px;align-items:center;font-size:14.5px}
.bl-i{color:var(--muted);font:500 13px var(--f-mono)}.bl-n{font-weight:600}.bl-v{text-align:right;font-family:var(--f-mono)}
.bl-t{position:relative;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bl-o{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--p-green) 22%,transparent);border-left:1.5px solid var(--p-green);border-right:1.5px solid var(--p-green)}
.bl-f{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}.bl-f.ok{background:var(--p-green)}
.bl-more{background:none;border:0;color:var(--muted);font-size:13.5px;padding:4px;justify-self:center}
.bl-tot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;font-size:15px}
.rec-h{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:inherit;text-align:left;width:100%}.rec-h h2{margin:0}.chev2{color:var(--muted);font-size:13px}
.rec-b{margin-left:auto;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid;display:flex;align-items:center;gap:6px}.rec-b::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.ok{--rc:#3fbf6a}.mid{--rc:#f0a531}.hi{--rc:#f05a4f}

.rec-g{display:grid;gap:8px}.rec-t{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}

.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.thm{display:grid;gap:6px;justify-items:start;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px;color:var(--ink);text-align:left}
.thm.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.thm .sw{width:100%;height:46px;border-radius:9px;display:flex;align-items:flex-end;gap:5px;padding:7px;border:1px solid rgba(127,127,127,.25)}
.thm .sw i{width:18px;height:18px;border-radius:50%;display:block}
.thm b{font-size:12.5px;font-weight:600}
.hacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hacts .btn{min-height:46px}
.mhead{font:700 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 2px -2px}
.hempty{display:grid;justify-items:center;gap:10px;text-align:center;padding:30px 18px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.hempty svg{width:48px;height:48px;color:var(--accent)}
.hempty b{font:700 22px var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.hempty p{margin:0;color:var(--muted);font-size:14px;max-width:34ch}
.prs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.prs>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.prs b{display:block;font:600 19px var(--f-mono);margin-top:3px;font-variant-numeric:tabular-nums}

/* barbell calculator */
.bbbig{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:10px;overflow:hidden}
.bbbig svg{display:block;width:100%;height:auto}
.wtctl{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.wtctl button{height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:700 22px var(--f-mono)}
.wtctl input{height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:center;font:600 28px var(--f-mono);width:100%;min-width:0}
.perside{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font:500 13px var(--f-mono)}
.plate{display:inline-grid;place-items:center;min-width:30px;height:24px;border-radius:4px;padding:0 4px;font-weight:600;font-size:12px}
.wlist{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.wlist>div{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font:500 14px var(--f-mono)}
.wlist>div:first-child{border-top:0}
.wlist .pc{font-size:11.5px;color:var(--muted);text-align:right}
.callout{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.callout b{font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}

/* sheet */
.scrim{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:20;background:rgba(8,12,18,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;max-height:calc(var(--vvh,100dvh) * .94);border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.tall{height:90vh;height:90dvh;height:calc(var(--vvh,100dvh) * .92)}
/* the barbell calculator docks to the top so the phone keyboard never covers the weight box or the bar */
.scrim.attop{align-items:flex-start}
.scrim.attop .sheet{border-radius:0 0 18px 18px;padding-top:env(safe-area-inset-top,0px);padding-bottom:0;max-height:calc(var(--vvh,100dvh) - 8px)}
.scrim.attop .sheet-h{padding-top:10px;padding-bottom:6px}
.scrim.attop .sheet-b{gap:10px;padding-top:4px}
.scrim.attop .bbbig{padding:6px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:86vh}.sheet.tall{height:86vh}.scrim.attop{align-items:flex-start;padding-top:24px}.scrim.attop .sheet{border-radius:18px}}
.sheet-h{flex:none;display:flex;align-items:center;gap:10px;padding:16px 18px 10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet-h h2{flex:1;font:700 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.sheet-top{flex:none;display:grid;gap:10px;padding:0 18px 10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.sheet-b{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:10px 18px 18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px;align-content:start}
/* long lists inside a sheet must keep their full height so the sheet body scrolls (an overflow:hidden grid item otherwise shrinks to fit) */
.sheet-b>.list,.sheet-b>.wlist,.sheet-b>.menu{min-height:max-content}
.sheet-f{flex:none;padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--surface);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.sheet-f .btn{flex:1}
.menu{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.menu button{border:0;border-top:1px solid var(--line);background:none;padding:13px 14px;text-align:left;font-weight:500;display:flex;justify-content:space-between;gap:10px}
.menu button:first-child{border-top:0}
.menu button.danger{color:var(--danger)}
.menu button:disabled{opacity:.4}
.dl{display:grid;gap:4px}
.dl .ex{font-weight:600;margin-top:8px}
.dl .s{display:flex;gap:10px;font:500 13.5px var(--f-mono)}
.dl .s .tg{width:22px;color:var(--muted)}
.trophy{display:grid;justify-items:center;gap:6px;text-align:center;padding:10px 0}
.trophy .big{font:800 54px/1 var(--f-display);letter-spacing:.02em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;max-width:calc(100% - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;display:grid;gap:10px;justify-items:center}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.step button{border:0;background:none;width:30px;height:32px;font-weight:700}
.step span{min-width:24px;text-align:center;font:600 14px var(--f-mono)}
.rr{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.rr input{width:46px;height:32px;border:1px solid var(--line);border-radius:7px;text-align:center;background:var(--surface);font:600 14px var(--f-mono)}
.redit{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.redit .tl{display:flex;gap:8px;align-items:center}
.redit .tl b{flex:1;min-width:0;font-weight:600}
.redit .ctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:32px;height:32px;display:grid;place-items:center;padding:0;color:var(--muted);flex:none}
.mini svg{width:16px;height:16px}
@media (max-width:380px){.srow{grid-template-columns:32px minmax(0,1fr) 58px 52px 36px 20px;gap:4px}.stats b{font-size:18px}.brand{font-size:22px}.unit button{padding:7px 8px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const FX=[["Ab_Crunch_Machine","Ab Crunch Machine","Select a light resistance and sit down on the ab machine placing your feet under the pads provided and grabbing the top handles. Your arms should be bent at a 90 degree angle as you rest the triceps on the pads provided. This will be your starting position.\nAt the same time, begin to lift the legs up as you crunch your upper torso. Breathe out as you perform this movement. Tip: Be sure to use a slow and controlled motion. Concentrate on using your abs to move the weight while relaxing your legs and feet.\nAfter a second pause, slowly return to the starting position as you breathe in.\nRepeat the movement for the prescribed amount of repetitions.",2],["Alternating_Floor_Press","Alternating Floor Press","Lie on the floor with two kettlebells next to your shoulders.\nPosition one in place on your chest and then the other, gripping the kettlebells on the handle with the palms facing forward.\nExtend both arms, so that the kettlebells are being held above your chest. Lower one kettlebell, bringing it to your chest and turn the wrist in the direction of the locked out kettlebell.\nRaise the kettlebell and repeat on the opposite side.",2],["Alternating_Kettlebell_Row","Alternating Kettlebell Row","Place two kettlebells in front of your feet. Bend your knees slightly and push your butt out as much as possible. As you bend over to get into the starting position grab both kettlebells by the handles.\nPull one kettlebell off of the floor while holding on to the other kettlebell. Retract the shoulder blade of the working side, as you flex the elbow, drawing the kettlebell towards your stomach or rib cage.\nLower the kettlebell in the working arm and repeat with your other arm.",2],["Alternating_Renegade_Row","Alternating Renegade Row","Place two kettlebells on the floor about shoulder width apart. Position yourself on your toes and your hands as though you were doing a pushup, with the body straight and extended. Use the handles of the kettlebells to support your upper body. You may need to position your feet wide for support.\nPush one kettlebell into the floor and row the other kettlebell, retracting the shoulder blade of the working side as you flex the elbow, pulling it to your side.\nThen lower the kettlebell to the floor and begin the kettlebell in the opposite hand. Repeat for several reps.",2],["Ankle_Circles","Ankle Circles","Use a sturdy object like a squat rack to hold yourself.\nLift the right leg in the air (just around 2 inches from the floor) and perform a circular motion with the big toe. Pretend that you are drawing a big circle with it. Tip: One circle equals 1 repetition. Breathe normally as you perform the movement.\nWhen you are done with the right foot, then repeat with the left leg.",2],["Arnold_Dumbbell_Press","Arnold Dumbbell Press","Sit on an exercise bench with back support and hold two dumbbells in front of you at about upper chest level with your palms facing your body and your elbows bent. Tip: Your arms should be next to your torso. The starting position should look like the contracted portion of a dumbbell curl.\nNow to perform the movement, raise the dumbbells as you rotate the palms of your hands until they are facing forward.\nContinue lifting the dumbbells until your arms are extended above you in straight arm position. Breathe out as you perform this portion of the movement.\nAfter a second pause at the top, begin to lower the dumbbells to the original position by rotating the palms of your hands towards you. Tip: The left arm will be rotated in a counter clockwise manner while the right one will be rotated clockwise. Breathe in as you perform this portion of the movement.\nRepeat for the recommended amount of repetitions.",2],["Atlas_Stone_Trainer","Atlas Stone Trainer","This trainer is effective for developing Atlas Stone strength for those who don't have access to stones, and are typically made from bar ends or heavy pipe.\nBegin by loading the desired weight onto the bar. Straddle the weight, wrapping your arms around the implement, bending at the hips.\nBegin by pulling the weight up past the knees, extending through the hips. As the weight clears the knees, it can be lapped by resting it on your thighs and sitting back, hugging it tightly to your chest.\nFinish the movement by extending through your hips and knees to raise the weight as high as possible. The weight can be returned to the lap or to the ground for successive repetitions.",2],["Axle_Deadlift","Axle Deadlift","Approach the bar so that it is centered over your feet. You feet should be about hip width apart. Bend at the hip to grip the bar at shoulder width, allowing your shoulder blades to protract. Typically, you would use an over/under grip.\nWith your feet and your grip set, take a big breath and then lower your hips and flex the knees until your shins contact the bar. Look forward with your head, keep your chest up and your back arched, and begin driving through the heels to move the weight upward.\nAfter the bar passes the knees, aggressively pull the bar back, pulling your shoulder blades together as you drive your hips forward into the bar.\nLower the bar by bending at the hips and guiding it to the floor.",2],["Ball_Leg_Curl","Ball Leg Curl","Begin on the floor laying on your back with your feet on top of the ball.\nPosition the ball so that when your legs are extended your ankles are on top of the ball. This will be your starting position.\nRaise your hips off of the ground, keeping your weight on the shoulder blades and your feet.\nFlex the knees, pulling the ball as close to you as you can, contracting the hamstrings.\nAfter a brief pause, return to the starting position.",2],["Band_Assisted_Pull-Up","Band Assisted Pull-Up","Choke the band around the center of the pullup bar. You can use different bands to provide varying levels of assistance.\nPull the end of the band down, and place one bent knee into the loop, ensuring it won't slip out. Take a medium to wide grip on the bar. This will be your starting position.\nPull yourself upward by contracting the lats as you flex the elbow. The elbow should be driven to your side. Pull to the front, attempting to get your chin over the bar. Avoid swinging or jerking movements.\nAfter a brief pause, return to the starting position.",2],["Band_Good_Morning","Band Good Morning","Using a 41 inch band, stand on one end, spreading your feet a small amount. Bend at the hips to loop the end of the band behind your neck. This will be your starting position.\nKeeping your legs straight, extend through the hips to come to a near vertical position.\nEnsure that you do not round your back as you go down back to the starting position.",2],["Band_Pull_Apart","Band Pull Apart","Begin with your arms extended straight out in front of you, holding the band with both hands.\nInitiate the movement by performing a reverse fly motion, moving your hands out laterally to your sides.\nKeep your elbows extended as you perform the movement, bringing the band to your chest. Ensure that you keep your shoulders back during the exercise.\nPause as you complete the movement, returning to the starting position under control.",2],["Band_Skull_Crusher","Band Skull Crusher","Secure a band to the base of a rack or the bench. Lay on the bench so that the band is lined up with your head.\nTake hold of the band, raising your elbows so that the upper arm is perpendicular to the floor. With the elbow flexed, the band should be above your head. This will be your starting position.\nExtend through the elbow to straighten your arm, keeping your upper arm in place. Pause at the top of the motion, and return to the starting position.",2],["Barbell_Ab_Rollout","Barbell Ab Rollout","For this exercise you will need to get into a pushup position, but instead of having your hands of the floor, you will be grabbing on to an Olympic barbell (loaded with 5-10 lbs on each side) instead. This will be your starting position.\nWhile keeping a slight arch on your back, lift your hips and roll the barbell towards your feet as you exhale. Tip: As you perform the movement, your glutes should be coming up, you should be keeping the abs tight and should maintain your back posture at all times. Also your arms should be staying perpendicular to the floor throughout the movement. If you don't, you will work out your shoulders and back more than the abs.\nAfter a second contraction at the top, start to roll the barbell back forward to the starting position slowly as you inhale.\nRepeat for the recommended amount of repetitions.",2],["Barbell_Ab_Rollout_-_On_Knees","Barbell Ab Rollout - On Knees","Hold an Olympic barbell loaded with 5-10lbs on each side and kneel on the floor.\nNow place the barbell on the floor in front of you so that you are on all your hands and knees (as in a kneeling push up position). This will be your starting position.\nSlowly roll the barbell straight forward, stretching your body into a straight position. Tip: Go down as far as you can without touching the floor with your body. Breathe in during this portion of the movement.\nAfter a second pause at the stretched position, start pulling yourself back to the starting position as you breathe out. Tip: Go slowly and keep your abs tight at all times.",2],["Barbell_Bench_Press_-_Medium_Grip","Barbell Bench Press - Medium Grip","Lie back on a flat bench. Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.\nFrom the starting position, breathe in and begin coming down slowly until the bar touches your middle chest.\nAfter a brief pause, push the bar back to the starting position as you breathe out. Focus on pushing the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position at the top of the motion, hold for a second and then start coming down slowly again. Tip: Ideally, lowering the weight should take about twice as long as raising it.\nRepeat the movement for the prescribed amount of repetitions.\nWhen you are done, place the bar back in the rack.",2],["Barbell_Curl","Barbell Curl","Stand up with your torso upright while holding a barbell at a shoulder-width grip. The palm of your hands should be facing forward and the elbows should be close to the torso. This will be your starting position.\nWhile holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.\nContinue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.\nSlowly begin to bring the bar back to starting position as your breathe in.\nRepeat for the recommended amount of repetitions.",2],["Barbell_Deadlift","Barbell Deadlift","Stand in front of a loaded barbell.\nWhile keeping the back as straight as possible, bend your knees, bend forward and grasp the bar using a medium (shoulder width) overhand grip. This will be the starting position of the exercise. Tip: If it is difficult to hold on to the bar with this grip, alternate your grip or use wrist straps.\nWhile holding the bar, start the lift by pushing with your legs while simultaneously getting your torso to the upright position as you breathe out. In the upright position, stick your chest out and contract the back by bringing the shoulder blades back. Think of how the soldiers in the military look when they are in standing in attention.\nGo back to the starting position by bending at the knees while simultaneously leaning the torso forward at the waist while keeping the back straight. When the weights on the bar touch the floor you are back at the starting position and ready to perform another repetition.\nPerform the amount of repetitions prescribed in the program.",2],["Barbell_Glute_Bridge","Barbell Glute Bridge","Begin seated on the ground with a loaded barbell over your legs. Using a fat bar or having a pad on the bar can greatly reduce the discomfort caused by this exercise. Roll the bar so that it is directly above your hips, and lay down flat on the floor.\nBegin the movement by driving through with your heels, extending your hips vertically through the bar. Your weight should be supported by your upper back and the heels of your feet.\nExtend as far as possible, then reverse the motion to return to the starting position.",2],["Barbell_Hip_Thrust","Barbell Hip Thrust","Begin seated on the ground with a bench directly behind you. Have a loaded barbell over your legs. Using a fat bar or having a pad on the bar can greatly reduce the discomfort caused by this exercise.\nRoll the bar so that it is directly above your hips, and lean back against the bench so that your shoulder blades are near the top of it.\nBegin the movement by driving through your feet, extending your hips vertically through the bar. Your weight should be supported by your shoulder blades and your feet. Extend as far as possible, then reverse the motion to return to the starting position.",2],["Barbell_Incline_Bench_Press_-_Medium_Grip","Barbell Incline Bench Press - Medium Grip","Lie back on an incline bench. Using a medium-width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.\nAs you breathe in, come down slowly until you feel the bar on you upper chest.\nAfter a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly again. Tip: it should take at least twice as long to go down than to come up.\nRepeat the movement for the prescribed amount of repetitions.\nWhen you are done, place the bar back in the rack.",2],["Barbell_Lunge","Barbell Lunge","This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.\nHold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.\nStep away from the rack and step forward with your right leg and squat down through your hips, while keeping the torso upright and maintaining balance. Inhale as you go down. Note: Do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. li>\nUsing mainly the heel of your foot, push up and go back to the starting position as you exhale.\nRepeat the movement for the recommended amount of repetitions and then perform with the left leg.",2],["Barbell_Rear_Delt_Row","Barbell Rear Delt Row","Stand up straight while holding a barbell using a wide (higher than shoulder width) and overhand (palms facing your body) grip.\nBend knees slightly and bend over as you keep the natural arch of your back. Let the arms hang in front of you as they hold the bar. Once your torso is parallel to the floor, flare the elbows out and away from your body. Tip: Your torso and your arms should resemble the letter \"T\". Now you are ready to begin the exercise.\nWhile keeping the upper arms perpendicular to the torso, pull the barbell up towards your upper chest as you squeeze the rear delts and you breathe out. Tip: When performed correctly, this exercise should resemble a bench press in reverse. Also, refrain from using your biceps to do the work. Focus on targeting the rear delts; the arms should only act as hooks.\nSlowly go back to the initial position as you breathe in.\nRepeat for the recommended amount of repetitions.",2],["Barbell_Seated_Calf_Raise","Barbell Seated Calf Raise","Place a block about 12 inches in front of a flat bench.\nSit on the bench and place the ball of your feet on the block.\nHave someone place a barbell over your upper thighs about 3 inches above your knees and hold it there. This will be your starting position.\nRaise up on your toes as high as possible as you squeeze the calves and as you breathe out.\nAfter a second contraction, slowly go back to the starting position. Tip: To get maximum benefit stretch your calves as far as you can.\nRepeat for the recommended amount of repetitions.",2],["Barbell_Shoulder_Press","Barbell Shoulder Press","Sit on a bench with back support in a squat rack. Position a barbell at a height that is just above your head. Grab the barbell with a pronated grip (palms facing forward).\nOnce you pick up the barbell with the correct grip width, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.\nLower the bar down to the shoulders slowly as you inhale.\nLift the bar back up to the starting position as you exhale.\nRepeat for the recommended amount of repetitions.",2],["Barbell_Shrug","Barbell Shrug","Stand up straight with your feet at shoulder width as you hold a barbell with both hands in front of you using a pronated grip (palms facing the thighs). Tip: Your hands should be a little wider than shoulder width apart. You can use wrist wraps for this exercise for a better grip. This will be your starting position.\nRaise your shoulders up as far as you can go as you breathe out and hold the contraction for a second. Tip: Refrain from trying to lift the barbell by using your biceps.\nSlowly return to the starting position as you breathe in.\nRepeat for the recommended amount of repetitions.",2],["Barbell_Shrug_Behind_The_Back","Barbell Shrug Behind The Back","Stand up straight with your feet at shoulder width as you hold a barbell with both hands behind your back using a pronated grip (palms facing back). Tip: Your hands should be a little wider than shoulder width apart. You can use wrist wraps for this exercise for better grip. This will be your starting position.\nRaise your shoulders up as far as you can go as you breathe out and hold the contraction for a second. Tip: Refrain from trying to lift the barbell by using your biceps. The arms should remain stretched out at all times.\nSlowly return to the starting position as you breathe in.\nRepeat for the recommended amount of repetitions.",2],["Barbell_Side_Bend","Barbell Side Bend","Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck). Your feet should be shoulder width apart. This will be your starting position.\nWhile keeping your back straight and your head up, bend only at the waist to the right as far as possible. Breathe in as you bend to the side. Then hold for a second and come back up to the starting position as you exhale. Tip: Keep the rest of the body stationary.\nNow repeat the movement but bending to the left instead. Hold for a second and come back to the starting position.\nRepeat for the recommended amount of repetitions.",2],["Barbell_Side_Split_Squat","Barbell Side Split Squat","Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck). Your feet should be placed wide apart with the foot of the lead leg angled out to the side. This will be your starting position.\nLower your body towards the side of your angled foot by bending the knee and hip of your lead leg and while keeping the opposite leg only slightly bent. Breathe in as you lower your body.\nReturn to the starting position by extending the hip and knee of the lead leg. Breathe out as you perform this movement.\nAfter performing the recommended amount of reps, repeat the movement with the opposite leg.",2],["Barbell_Squat","Barbell Squat","This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack to just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.\nHold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.\nStep away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).\nBegin to slowly lower the bar by bending the knees and hips as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees. Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.\nBegin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position.\nRepeat for the recommended amount of repetitions.",2],["Barbell_Step_Ups","Barbell Step Ups","Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck) and stand upright behind an elevated platform (such as the one used for spotting behind a flat bench). This is your starting position.\nPlace the right foot on the elevated platform. Step on the platform by extending the hip and the knee of your right leg. Use the heel mainly to lift the rest of your body up and place the foot of the left leg on the platform as well. Breathe out as you execute the force required to come up.\nStep down with the left leg by flexing the hip and knee of the right leg as you inhale. Return to the original standing position by placing the right foot of to next to the left foot on the initial position.\nRepeat with the right leg for the recommended amount of repetitions and then perform with the left leg.",2],["Barbell_Walking_Lunge","Barbell Walking Lunge","Begin standing with your feet shoulder width apart and a barbell across your upper back.\nStep forward with one leg, flexing the knees to drop your hips. Descend until your rear knee nearly touches the ground. Your posture should remain upright, and your front knee should stay above the front foot.\nDrive through the heel of your lead foot and extend both knees to raise yourself back up.\nStep forward with your rear foot, repeating the lunge on the opposite leg.",2],["Bear_Crawl_Sled_Drags","Bear Crawl Sled Drags","Wearing either a harness or a loose weight belt, attach the chain to the back so that you will be facing away from the sled. Bend down so that your hands are on the ground. Your back should be flat and knees bent. This is your starting position.\nBegin by driving with legs, alternating left and right. Use your hands to maintain balance and to help pull. Try to keep your back flat as you move over a given distance.",2],["Bench_Dips","Bench Dips","For this exercise you will need to place a bench behind your back. With the bench perpendicular to your body, and while looking away from it, hold on to the bench on its edge with the hands fully extended, separated at shoulder width. The legs will be extended forward, bent at the waist and perpendicular to your torso. This will be your starting position.\nSlowly lower your body as you inhale by bending at the elbows until you lower yourself far enough to where there is an angle slightly smaller than 90 degrees between the upper arm and the forearm. Tip: Keep the elbows as close as possible throughout the movement. Forearms should always be pointing down.\nUsing your triceps to bring your torso up again, lift yourself back to the starting position.\nRepeat for the recommended amount of repetitions.",2],["Bench_Press_-_With_Bands","Bench Press - With Bands","Using a flat bench secure a band under the leg of the bench that is nearest to your head.\nOnce the band is secure, grab it by both handles and lie down on the bench.\nExtend your arms so that you are holding the band handles in front of you at shoulder width.\nOnce at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.\nBring down the handles slowly until your elbow forms a 90 degree angle. Keep full control at all times.\nAs you breathe out, bring the handles up using your pectoral muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up.\nRepeat the movement for the prescribed amount of repetitions of your training program.",2],["Bent-Arm_Barbell_Pullover","Bent-Arm Barbell Pullover","Lie on a flat bench with a barbell using a shoulder grip width.\nHold the bar straight over your chest with a bend in your arms. This will be your starting position.\nWhile keeping your arms in the bent arm position, lower the weight slowly in an arc behind your head while breathing in until you feel a stretch on the chest.\nAt that point, bring the barbell back to the starting position using the arc through which the weight was lowered and exhale as you perform this movement.\nHold the weight on the initial position for a second and repeat the motion for the prescribed number of repetitions.",2],["Bent-Arm_Dumbbell_Pullover","Bent-Arm Dumbbell Pullover","Place a dumbbell standing up on a flat bench.\nEnsuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench (torso across it as in forming a cross) with only your shoulders lying on the surface. Hips should be below the bench and legs bent with feet firmly on the floor. The head will be off the bench as well.\nGrasp the dumbbell with both hands and hold it straight over your chest with a bend in your arms. Both palms should be pressing against the underside one of the sides of the dumbbell. This will be your starting position. Caution: Always ensure that the dumbbell used for this exercise is secure. Using a dumbbell with loose plates can result in the dumbbell falling apart and falling on your face.\nWhile keeping your arms locked in the bent arm position, lower the weight slowly in an arc behind your head while breathing in until you feel a stretch on the chest.\nAt that point, bring the dumbbell back to the starting position using the arc through which the weight was lowered and exhale as you perform this movement.\nHold the weight on the initial position for a second and repeat the motion for the prescribed number of repetitions.",2],["Bent-Knee_Hip_Raise","Bent-Knee Hip Raise","Lay flat on the floor with your arms next to your sides.\nNow bend your knees at around a 75 degree angle and lift your feet off the floor by around 2 inches.\nUsing your lower abs, bring your knees in towards you as you maintain the 75 degree angle bend in your legs. Continue this movement until you raise your hips off of the floor by rolling your pelvis backward. Breathe out as you perform this portion of the movement. Tip: At the end of the movement your knees will be over your chest.\nSqueeze your abs at the top of the movement for a second and then return to the starting position slowly as you breathe in. Tip: Maintain a controlled motion at all times.\nRepeat for the recommended amount of repetitions.",2],["Bent_Over_Barbell_Row","Bent Over Barbell Row","Holding a barbell with a pronated grip (palms facing down), bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The barbell should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.\nNow, while keeping the torso stationary, breathe out and lift the barbell to you. Keep the elbows close to the body and only use the forearms to hold the weight. At the top contracted position, squeeze the back muscles and hold for a brief pause.\nThen inhale and slowly lower the barbell back to the starting position.\nRepeat for the recommended amount of repetitions.",2],["Bent_Over_Two-Dumbbell_Row","Bent Over Two-Dumbbell Row","With a dumbbell in each hand (palms facing your torso), bend your knees slightly and bring your torso forward by bending at the waist; as you bend make sure to keep your back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The weights should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.\nWhile keeping the torso stationary, lift the dumbbells to your side (as you breathe out), keeping the elbows close to the body (do not exert any force with the forearm other than holding the weights). On the top contracted position, squeeze the back muscles and hold for a second.\nSlowly lower the weight again to the starting position as you inhale.\nRepeat for the recommended amount of repetitions.",2],["Bent_Press","Bent Press","Clean a kettlebell to your shoulder. Clean the kettlebell to your shoulders by extending through the legs and hips as you raise the kettlebell towards your shoulder. The wrist should rotate as you do so. This will be your starting position.\nBegin my leaning to the side opposite the kettlebell, continuing until you are able to touch the ground with your free hand, keeping your eyes on the kettlebell. As you do so, press the weight vertically be extending through the elbow, keeping your arm perpendicular to the ground.\nReturn to an upright position, with the kettlebell above your head. Return the kettlebell to the shoulder and repeat for the desired number of repetitions.",2],["Board_Press","Board Press","Begin by lying on the bench, getting your head beyond the bar if possible. One to five boards, made out of 2x6's, can be screwed together and held in place by a training partner, bands, or just tucked under your shirt.\nTuck your feet underneath you and arch your back. Using the bar to help support your weight, lift your shoulder off the bench and retract them, squeezing the shoulder blades together. Use your feet to drive your traps into the bench. Maintain this tight body position throughout the movement.\nYou can take a standard bench grip, or shoulder width to focus on the triceps. Pull the bar out of the rack without protracting your shoulders. The bar, wrist, and elbow should stay in line at all times. Focus on squeezing the bar and trying to pull it apart.\nLower the bar to the boards, and then drive the bar up with as much force as possible. The elbows should be tucked in until lockout.",2],["Body_Tricep_Press","Body Tricep Press","Position a bar in a rack at chest height.\nStanding, take a shoulder width grip on the bar and step a yard or two back, feet together and arms extended so that you are leaning on the bar. This will be your starting position.\nBegin by flexing the elbow, lowering yourself towards the bar.\nPause, and then reverse the motion by extending the elbows.\nProgress from bodyweight by adding chains over your shoulders.",2],["Bodyweight_Flyes","Bodyweight Flyes","Position two equally loaded EZ bars on the ground next to each other. Ensure they are able to roll.\nAssume a push-up position over the bars, supporting your weight on your toes and hands with your arms extended and body straight.\nPlace your hands on the bars. This will be your starting position.\nUsing a slow and controlled motion, move your hands away from the midline of your body, rolling the bars apart. Inhale during this portion of the motion.\nAfter moving the bars as far apart as you can, return to the starting position by pulling them back together. Exhale as you perform this movement.",2],["Bodyweight_Mid_Row","Bodyweight Mid Row","Begin by taking a medium to wide grip on a pull-up apparatus with your palms facing away from you. From a hanging position, tuck your knees to your chest, leaning back and getting your legs over your side of the pull-up apparatus. This will be your starting position.\nBeginning with your arms straight, flex the elbows and retract the shoulder blades to raise your body up until your legs contact the pull-up apparatus.\nAfter a brief pause, return to the starting position.",2],["Bodyweight_Squat","Bodyweight Squat","Stand with your feet shoulder width apart. You can place your hands behind your head. This will be your starting position.\nBegin the movement by flexing your knees and hips, sitting back with your hips.\nContinue down to full depth if you are able,and quickly reverse the motion until you return to the starting position. As you squat, keep your head and chest up and push your knees out.",2],["Bodyweight_Walking_Lunge","Bodyweight Walking Lunge","Begin standing with your feet shoulder width apart and your hands on your hips.\nStep forward with one leg, flexing the knees to drop your hips. Descend until your rear knee nearly touches the ground. Your posture should remain upright, and your front knee should stay above the front foot.\nDrive through the heel of your lead foot and extend both knees to raise yourself back up.\nStep forward with your rear foot, repeating the lunge on the opposite leg.",2],["Box_Squat","Box Squat","The box squat allows you to squat to desired depth and develop explosive strength in the squat movement. Begin in a power rack with a box at the appropriate height behind you. Typically, you would aim for a box height that brings you to a parallel squat, but you can train higher or lower if desired.\nBegin by stepping under the bar and placing it across the back of the shoulders. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders. Remove the bar from the rack, creating a tight arch in your lower back, and step back into position. Place your feet wider for more emphasis on the back, glutes, adductors, and hamstrings, or closer together for more quad development. Keep your head facing forward.\nWith your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips until you are seated on the box. Ideally, your shins should be perpendicular to the ground. Pause when you reach the box, and relax the hip flexors. Never bounce off of a box.\nKeeping the weight on your heels and pushing your feet and knees out, drive upward off of the box as you lead the movement with your head. Continue upward, maintaining tightness head to toe.",2],["Cable_Chest_Press","Cable Chest Press","Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 45 degrees to the body, with your head and chest up. The elbows should be bent to about 90 degrees. This will be your starting position.\nBegin by extending through the elbow, pressing the handles together straight in front of you. Keep your shoulder blades retracted as you execute the movement.\nAfter pausing at full extension, return to th starting position, keeping tension on the cables.\nYou can also execute this movement with your back off the pad, at an incline or decline, or alternate hands.",2],["Cable_Crossover","Cable Crossover","To get yourself into the starting position, place the pulleys on a high position (above your head), select the resistance to be used and hold the pulleys in each hand.\nStep forward in front of an imaginary straight line between both pulleys while pulling your arms together in front of you. Your torso should have a small forward bend from the waist. This will be your starting position.\nWith a slight bend on your elbows in order to prevent stress at the biceps tendon, extend your arms to the side (straight out at both sides) in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms and torso should remain stationary; the movement should only occur at the shoulder joint.\nReturn your arms back to the starting position as you breathe out. Make sure to use the same arc of motion used to lower the weights.\nHold for a second at the starting position and repeat the movement for the prescribed amount of repetitions.",2],["Cable_Crunch","Cable Crunch","Kneel below a high pulley that contains a rope attachment.\nGrasp cable rope attachment and lower the rope until your hands are placed next to your face.\nFlex your hips slightly and allow the weight to hyperextend the lower back. This will be your starting position.\nWith the hips stationary, flex the waist as you contract the abs so that the elbows travel towards the middle of the thighs. Exhale as you perform this portion of the movement and hold the contraction for a second.\nSlowly return to the starting position as you inhale. Tip: Make sure that you keep constant tension on the abs throughout the movement. Also, do not choose a weight so heavy that the lower back handles the brunt of the work.\nRepeat for the recommended amount of repetitions.",2],["Cable_Hammer_Curls_-_Rope_Attachment","Cable Hammer Curls - Rope Attachment","Attach a rope attachment to a low pulley and stand facing the machine about 12 inches away from it.\nGrasp the rope with a neutral (palms-in) grip and stand straight up keeping the natural arch of the back and your torso stationary.\nPut your elbows in by your side and keep them there stationary during the entire movement. Tip: Only the forearms should move; not your upper arms. This will be your starting position.\nUsing your biceps, pull your arms up as you exhale until your biceps touch your forearms. Tip: Remember to keep the elbows in and your upper arms stationary.\nAfter a 1 second contraction where you squeeze your biceps, slowly start to bring the weight back to the original position.\nRepeat for the recommended amount of repetitions.",2],["Cable_Hip_Adduction","Cable Hip Adduction","Stand in front of a low pulley facing forward with one leg next to the pulley and the other one away.\nAttach the ankle cuff to the cable and also to the ankle of the leg that is next to the pulley.\nNow step out and away from the stack with a wide stance and grasp the bar of the pulley system.\nStand on the foot that does not have the ankle cuff (the far foot) and allow the leg with the cuff to be pulled towards the low pulley. This will be your starting position.\nNow perform the movement by moving the leg with the ankle cuff in front of the far leg by using the inner thighs to abduct the hip. Breathe out during this portion of the movement.\nSlowly return to the starting position as you breathe in.\nRepeat for the recommended amount of repetitions and then repeat the same movement with the opposite leg.",2],["Cable_Internal_Rotation","Cable Internal Rotation","Sit next to a low pulley sideways (with legs stretched in front of you or crossed) and grasp the single hand cable attachment with the arm nearest to the cable. Tip: If you can adjust the pulley's height, you can use a flat bench to sit on instead.\nPosition the elbow against your side with the elbow bent at 90° and the arm pointing towards the pulley. This will be your starting position.\nPull the single hand cable attachment toward your body by internally rotating your shoulder until your forearm is across your abs. You will be creating an imaginary semi-circle. Tip: The forearm should be perpendicular to your torso at all times.\nSlowly go back to the initial position.\nRepeat for the recommended amount of repetitions and then repeat the movement with the next arm.",2],["Cable_Iron_Cross","Cable Iron Cross","Begin by moving the pulleys to the high position, select the resistance to be used, and take a handle in each hand.\nStand directly between both pulleys with your arms extended out to your sides. Your head and chest should be up while your arms form a \"T\". This will be your starting position.\nKeeping the elbows extended, pull your arms straight to your sides.\nReturn your arms back to the starting position after a pause at the peak contraction.\nContinue the movement for the prescribed number of repetitions.",2],["Cable_Lying_Triceps_Extension","Cable Lying Triceps Extension","Lie on a flat bench and grasp the straight bar attachment of a low pulley with a narrow overhand grip. Tip: The easiest way to do this is to have someone hand you the bar as you lay down.\nWith your arms extended, position the bar over your torso. Your arms and your torso should create a 90-degree angle. This will be your starting position.\nLower the bar by bending at the elbow while keeping the upper arms stationary and elbows in. Go down until the bar lightly touches your forehead. Breathe in as you perform this portion of the movement.\nFlex the triceps as you lift the bar back to its starting position. Exhale as you perform this portion of the movement.\nHold for a second at the contracted position and repeat for the recommended amount of repetitions.",2],["Cable_Preacher_Curl","Cable Preacher Curl","Place a preacher bench about 2 feet in front of a pulley machine.\nAttach a straight bar to the low pulley.\nSit at the preacher bench with your
