ly tighten your glutes and hamstrings, fill your lungs with air and in a slow (three to six second count) ascent, slowly exhale. Tip: It is important to tighten the glutes and hamstrings as this will cause the hip flexors to be inactivated in a process called reciprocal inhibition, which basically means that opposite muscles to the contracted ones will relax.\nAs you inhale, slowly go back in a controlled manner to the starting position.\nRepeat for the recommended amount of repetitions.",2],["Jefferson_Squats","Jefferson Squats","Place a barbell on the floor.\nStand in the middle of the bar length wise.\nBend down by bending at the knees and keeping your back straight and grasp the front of the bar with your right hand. Your palm should be in (neutral grip) facing the left side.\nGrasp the rear of the bar with your left hand. The palm of your hand should be in neutral grip alignment (palms facing the right side). Tip: Ensure that your grip is even on the bar. Your torso should be positioned right in the middle of the bar and the distance between your torso and your right hand (which should be at the front) should be the same as the distance between your torso and your left hand (which should be to your back).\nNow stand straight up with the weight. Tip: Your feet should be shoulder width apart and your toes slightly pointed out.\nSquat down by bending at the knees and keeping your back straight until your upper thighs are parallel with the floor. Tip: Keep your back as vertical as possible with the floor and your head up. Also remember to not let your knees go past your toes. Inhale during this portion of the movement.\nNow drive yourself back up to the starting position by pushing with the feet . Tip: Keep the bar hanging at arm's length and your elbows locked with a slight bend. The arms only serve as hooks. Avoid doing any lifting with them. Do the lifting with your thighs; not your arms.",2],["Jogging_Treadmill","Jogging, Treadmill","To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.\nTreadmills offer convenience, cardiovascular benefits, and usually have less impact than jogging outside. A 150 lb person will burn almost 250 calories jogging for 30 minutes, compared to more than 450 calories running. Maintain proper posture as you jog, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate.",2],["Kettlebell_Arnold_Press","Kettlebell Arnold Press","Clean a kettlebell to your shoulder. Clean the kettlebell to your shoulder by extending through the legs and hips as you raise the kettlebell towards your shoulder. The palm should be facing inward.\nLooking straight ahead, press the kettlebell out and overhead, rotating your wrist so that your palm faces forward at the top of the motion.\nReturn the kettlebell to the starting position, with the palm facing in.",2],["Kettlebell_Halo","Kettlebell Halo","Stand tall with your feet hip-width apart. Hold a kettlebell upside down by the horns, with the bell above your hands and close to your chest. Brace your abdominals and squeeze your glutes so your ribcage stays down. This is your starting position.\nKeeping your elbows close to your head, move the kettlebell up past one ear and around behind your head.\nContinue the circle past the opposite ear and back down to the starting position in front of your chest, letting the bell pass close to your body throughout.\nComplete the prescribed number of circles in one direction, then repeat the same number in the opposite direction.\nMove slowly and keep your head, hips and lower back still. If your lower back arches or the bell drifts far from your head, use a lighter weight.",0],["Kettlebell_One-Legged_Deadlift","Kettlebell One-Legged Deadlift","Hold a kettlebell by the handle in one hand. Stand on one leg, on the same side that you hold the kettlebell.\nKeeping that knee slightly bent, perform a stiff legged deadlift by bending at the hip, extending your free leg behind you for balance.\nContinue lowering the kettlebell until you are parallel to the ground, and then return to the upright position.",2],["Kettlebell_Overhead_Triceps_Extension","Kettlebell Overhead Triceps Extension","Stand with your feet hip-width apart, holding a kettlebell by the horns with both hands. Press it overhead until your arms are extended, with the bell hanging behind your hands.\nBrace your abdominals and keep your upper arms vertical and close to your head. This is your starting position.\nBend at the elbows to lower the kettlebell behind your head, going as far as your shoulder mobility allows without your elbows flaring outward.\nExtend your elbows to press the kettlebell back to the starting position, keeping your upper arms still throughout.\nKeep your ribcage down and avoid arching your lower back as you extend.",0],["Kettlebell_Pistol_Squat","Kettlebell Pistol Squat","Pick up a kettlebell with two hands and hold it by the horns. Hold one leg off of the floor and squat down on the other.\nSquat down by flexing the knee and sitting back with the hips, holding the kettlebell up in front of you.\nHold the bottom position for a second and then reverse the motion, driving through the heel and keeping your head and chest up.\nLower yourself again and repeat.",2],["Kettlebell_Sumo_High_Pull","Kettlebell Sumo High Pull","Place a kettlebell on the ground between your feet. Position your feet in a wide stance, and grasp the kettlebell with two hands. Set your hips back as far as possible, with your knees bent. Keep your chest and head up. This will be your starting position.\nBegin by extending the hips and knees, simultaneously pulling the kettlebell to your shoulders, raising your elbows as you do so. Reverse the motion to return to the starting position.",2],["Kettlebell_Thruster","Kettlebell Thruster","Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you pull the kettlebells towards your shoulders. Rotate your wrists as you do so. This will be your starting position.\nBegin to squat by flexing your hips and knees, lowering your hips between your legs. Maintain an upright, straight back as you descend as low as you can.\nAt the bottom, reverse direction and squat by extending your knees and hips, driving through your heels. As you do so, press both kettlebells overhead by extending your arms straight up, using the momentum from the squat to help drive the weights upward.\nAs you begin the next repetition, return the weights to the shoulders.",2],["Kettlebell_Turkish_Get-Up_Squat_style","Kettlebell Turkish Get-Up (Squat style)","Lie on your back on the floor and press a kettlebell to the top position by extending the elbow. Bend the knee on the same side as the kettlebell.\nKeeping the kettlebell locked out at all times, pivot to the opposite side and use your non- working arm to assist you in driving forward to the lunge position.\nUsing your free hand, push yourself to a seated position, then progressing to your feet. While looking up at the kettlebell, slowly stand up. Reverse the motion back to the starting position and repeat.",2],["Kettlebell_Windmill","Kettlebell Windmill","Place a kettlebell in front of your lead foot and clean and press it overhead with your opposite arm. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulders. Rotate your wrist as you do so, so that the palm faces forward. Press it overhead by extending the elbow.\nKeeping the kettlebell locked out at all times, push your butt out in the direction of the locked out kettlebell. Turn your feet out at a forty-five degree angle from the arm with the locked out kettlebell. Bending at the hip to one side, sticking your butt out, slowly lean until you can touch the floor with your free hand. Keep your eyes on the kettlebell that you hold over your head at all times.\nPause for a second after reaching the ground and reverse the motion back to the starting position.",2],["Knee_Circles","Knee Circles","Stand with your legs together and hands by your waist.\nNow move your knees in a circular motion as you breathe normally.\nRepeat for the recommended amount of repetitions.",2],["Knee_Tuck_Jump","Knee Tuck Jump","Begin in a comfortable standing position with your knees slightly bent. Hold your hands in front of you, palms down with your fingertips together at chest height. This will be your starting position.\nRapidly dip down into a quarter squat and immediately explode upward. Drive the knees towards the chest, attempting to touch them to the palms of the hands.\nJump as high as you can, raising your knees up, and then ensure a good land be re-extending your legs, absorbing impact through be allowing the knees to rebend.",2],["Kneeling_High_Pulley_Row","Kneeling High Pulley Row","Select the appropriate weight using a pulley that is above your head. Attach a rope to the cable and kneel a couple of feet away, holding the rope out in front of you with both arms extended. This will be your starting position.\nInitiate the movement by flexing the elbows and fully retracting your shoulders, pulling the rope toward your upper chest with your elbows out.\nAfter pausing briefly, slowly return to the starting position.",2],["Kneeling_Single-Arm_High_Pulley_Row","Kneeling Single-Arm High Pulley Row","Attach a single handle to a high pulley and make your weight selection.\nKneel in front of the cable tower, taking the cable with one hand with your arm extended. This will be your starting position.\nStarting with your palm facing forward, pull the weight down to your torso by flexing the elbow and retract the shoulder blade. As you do so, rotate the wrist so that at the completion of the movement, your palm is now facing you.\nAfter a brief pause, return to the starting position.",2],["Kneeling_Squat","Kneeling Squat","Set the bar to the proper height in a power rack. Kneel behind the bar; it may be beneficial to put a mat down to pad your knees. Slide under the bar, racking it across the back of your shoulders. Your shoulder blades should be retracted and the bar tight across your back. Unrack the weight.\nWith your head looking forward, sit back with your butt until you touch your calves.\nReverse the motion, returning the torso to an upright position.",2],["Landmine_180s","Landmine 180's","Position a bar into a landmine or securely anchor it in a corner. Load the bar to an appropriate weight.\nRaise the bar from the floor, taking it to shoulder height with both hands with your arms extended in front of you. Adopt a wide stance. This will be your starting position.\nPerform the movement by rotating the trunk and hips as you swing the weight all the way down to one side. Keep your arms extended throughout the exercise.\nReverse the motion to swing the weight all the way to the opposite side.\nContinue alternating the movement until the set is complete.",2],["Lateral_Bound","Lateral Bound","Assume a half squat position facing 90 degrees from your direction of travel. This will be your starting position.\nAllow your lead leg to do a countermovement inward as you shift your weight to the outside leg.\nImmediately push off and extend, attempting to bound to the side as far as possible.\nUpon landing, immediately push off in the opposite direction, returning to your original start position.\nContinue back and forth for several repetitions.",2],["Lateral_Box_Jump","Lateral Box Jump","Assume a comfortable standing position, with a short box positioned next to you. This will be your starting position.\nQuickly dip into a quarter squat to initiate the stretch reflex, and immediately reverse direction to jump up and to the side.\nBring your knees high enough to ensure your feet have good clearance over the box.\nLand on the center of the box, using your legs to absorb the impact.\nCarefully jump down to the other side of the box, and continue going back and forth for several repetitions.",2],["Lateral_Cone_Hops","Lateral Cone Hops","Position a number of cones in a row several feet apart.\nStand next to the end of the cones, facing 90 degrees to the direction of travel. This will be your starting position.\nBegin the jump by dipping with the knees to initiate a stretch reflex, and immediately reverse direction to push off the ground, jumping up and sideways over the cone.\nUse your legs to absorb impact upon landing, and rebound into the next jump, continuing down the row of cones.",2],["Lateral_Raise_-_With_Bands","Lateral Raise - With Bands","To begin, stand on an exercise band so that tension begins at arm's length. Grasp the handles using a pronated (palms facing your thighs) grip that is slightly less than shoulder width. The handles should be resting on the sides of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.\nUse your side shoulders to lift the handles to the sides as you exhale. Continue to lift the handles until they are slightly above parallel. Tip: As you lift the handles, slightly tilt the hand as if you were pouring water and keep your arms extended. Also, keep your torso stationary and pause for a second at the top of the movement.\nLower the handles back down slowly to the starting position. Inhale as you perform this portion of the movement.\nRepeat for the recommended amount of repetitions.",2],["Leg_Extensions","Leg Extensions","For this exercise you will need to use a leg extension machine. First choose your weight and sit on the machine with your legs under the pad (feet pointed forward) and the hands holding the side bars. This will be your starting position. Tip: You will need to adjust the pad so that it falls on top of your lower leg (just above your feet). Also, make sure that your legs form a 90-degree angle between the lower and upper leg. If the angle is less than 90-degrees then that means the knee is over the toes which in turn creates undue stress at the knee joint. If the machine is designed that way, either look for another machine or just make sure that when you start executing the exercise you stop going down once you hit the 90-degree angle.\nUsing your quadriceps, extend your legs to the maximum as you exhale. Ensure that the rest of the body remains stationary on the seat. Pause a second on the contracted position.\nSlowly lower the weight back to the original position as you inhale, ensuring that you do not go past the 90-degree angle limit.\nRepeat for the recommended amount of times.",2],["Leg_Press","Leg Press","Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).\nLower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.\nAs you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.\nPushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale.\nRepeat for the recommended amount of repetitions and ensure to lock the safety pins properly once you are done. You do not want that platform falling on you fully loaded.",2],["Leg_Pull-In","Leg Pull-In","Lie on an exercise mat with your legs extended and your hands either palms facing down next to you or under your glutes. Tip: My preference is with the hands next to me. This will be your starting position.\nBend your knees and pull your upper thighs into your midsection as you breathe out. Continue the motion until your knees are around chest level. Contract your abs as you execute this movement and hold for a second at the top. Tip: As you perform the motion, the lower legs (calves) should always remain parallel to the floor.\nReturn to the starting position as you inhale.\nRepeat for the recommended amount of repetitions.",2],["Leverage_Chest_Press","Leverage Chest Press","Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the bottom or middle of the pectorals at the beginning of the motion.\nYour chest and head should be up and your shoulder blades retracted. This will be your starting position.\nPress the handles forward by extending through the elbow.\nAfter a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete.",2],["Leverage_Deadlift","Leverage Deadlift","Load the pins to an appropriate weight. Position yourself directly between the handles. Grasp the bottom handles with a comfortable grip, and then lower your hips as you take a breath. Look forward with your head and keep your chest up. This will be your starting position.\nReturn the weight to the starting position.",2],["Leverage_Decline_Chest_Press","Leverage Decline Chest Press","Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the bottom of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.\nPress the handles forward by extending through the elbow.\nAfter a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete.",2],["Leverage_Incline_Chest_Press","Leverage Incline Chest Press","Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.\nPress the handles forward by extending through the elbow.\nAfter a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete.",2],["Leverage_Shoulder_Press","Leverage Shoulder Press","Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the shoulders at the beginning of the motion. Your chest and head should be up and handles held with a pronated grip. This will be your starting position.\nPress the handles upward by extending through the elbow.\nAfter a brief pause at the top, return the weight to just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete.",2],["Leverage_Shrug","Leverage Shrug","Load the pins to an appropriate weight. Position yourself directly between the handles.\nGrasp the top handles with a comfortable grip, and then lower your hips as you take a breath. Look forward with your head and keep your chest up.\nDrive through the floor with your heels, extending your hips and knees as you rise to a standing position. Keep your arms straight throughout the movement, finishing with your shoulders back. This will be your starting position.\nRaise the weight by shrugging the shoulders towards your ears, moving straight up and down.\nPause at the top of the motion, and then return the weight to the starting position.",2],["Low_Cable_Crossover","Low Cable Crossover","To move into the starting position, place the pulleys at the low position, select the resistance to be used and grasp a handle in each hand.\nStep forward, gaining tension in the pulleys. Your palms should be facing forward, hands below the waist, and your arms straight. This will be your starting position.\nWith a slight bend in your arms, draw your hands upward and toward the midline of your body. Your hands should come together in front of your chest, palms facing up.\nReturn your arms back to the starting position after a brief pause.",2],["Low_Pulley_Row_To_Neck","Low Pulley Row To Neck","Sit on a low pulley row machine with a rope attachment.\nGrab the ends of the rope using a palms-down grip and sit with your back straight and your knees slightly bent. Tip: Keep your back almost completely vertical and your arms fully extended in front of you. This will be your starting position.\nWhile keeping your torso stationary, lift your elbows and start bending them as you pull the rope towards your neck while exhaling. Throughout the movement your upper arms should remain parallel to the floor. Tip: Continue this motion until your hands are almost next to your ears (the forearms will not be parallel to the floor at the end of the movement as they will be angled a bit upwards) and your elbows are out away from your sides.\nAfter holding for a second or so at the contracted position, come back slowly to the starting position as you inhale. Tip: Again, during no part of the movement should the torso move.\nRepeat for the recommended amount of repetitions.",2],["Lunge_Sprint","Lunge Sprint","Adjust a bar in a Smith machine to an appropriate height. Position yourself under the bar, racking it across the back of your shoulders. Unrack the bar, and then split your feet, moving one foot forward and one foot back. This will be your starting position.\nLower your back knee nearly to the ground, flexing the knees and lowering your hips as you do so.\nAt the bottom of the descent, immediately reverse direction. Explosively drive through the heel of your front foot with light pressure from your back foot. Jump up and reverse the position of your legs.\nRepeat for the recommended amount of repetitions.",2],["Lying_Cable_Curl","Lying Cable Curl","Grab a straight bar or E-Z bar attachment that is attached to the low pulley with both hands, using an underhand (palms facing up) shoulder-width grip.\nLie flat on your back on top of an exercise mat in front of the weight stack with your feet flat against the frame of the pulley machine and your legs straight.\nWith your arms extended and your elbows close to your body slightly bend your arms. This will be your starting position.\nWhile keeping your upper arms stationary and the elbows close to your body, curl the bar up slowly toward your chest as you breathe out and you squeeze the biceps.\nAfter a second squeeze at the top of the movement, slowly return to the starting position.\nRepeat for the recommended amount of repetitions.",2],["Lying_Dumbbell_Tricep_Extension","Lying Dumbbell Tricep Extension","Lie on a flat bench while holding two dumbbells directly in front of you. Your arms should be fully extended at a 90-degree angle from your torso and the floor. The palms should be facing in and the elbows should be tucked in. This is the starting position.\nAs you breathe in and you keep the upper arms stationary with the elbows in, slowly lower the weight until the dumbbells are near your ears.\nAt that point, while keeping the elbows in and the upper arms stationary, use the triceps to bring the weight back up to the starting position as you breathe out.\nRepeat for the recommended amount of repetitions.",2],["Lying_Leg_Curls","Lying Leg Curls","Adjust the machine lever to fit your height and lie face down on the leg curl machine with the pad of the lever on the back of your legs (just a few inches under the calves). Tip: Preferably use a leg curl machine that is angled as opposed to flat since an angled position is more favorable for hamstrings recruitment.\nKeeping the torso flat on the bench, ensure your legs are fully stretched and grab the side handles of the machine. Position your toes straight (or you can also use any of the other two stances described on the foot positioning section). This will be your starting position.\nAs you exhale, curl your legs up as far as possible without lifting the upper legs from the pad. Once you hit the fully contracted position, hold it for a second.\nAs you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions.",2],["Lying_T-Bar_Row","Lying T-Bar Row","Load up the T-bar Row Machine with the desired weight and adjust the leg height so that your upper chest is at the top of the pad. Tip: In some machines all you can do is stand on the appropriate step that allows you to be at a height that has the upper chest at the top of the pad.\nLay face down on the pad and grab the handles. You can either use a palms down, palms up, or palms in position depending on what part of your back you want to emphasize.\nLift the bar off the rack and extend your arms in front of you. This will be your starting position.\nAs you exhale slowly pull the weight up and squeeze your back at the top of the movement. Tip: Keep the upper arms as close to the torso as possible throughout the movement in order to better engage the back muscles. Also, do not lift your body off of the pad at any time and refrain from using the biceps to lift the weight.\nAfter a second contraction at the top of the movement, as you inhale, slowly go back down to the starting position.\nRepeat for the recommended amount of repetitions.",2],["Machine_Bench_Press","Machine Bench Press","Sit down on the Chest Press Machine and select the weight.\nStep on the lever provided by the machine since it will help you to bring the handles forward so that you can grab the handles and fully extend the arms.\nGrab the handles with a palms-down grip and lift your elbows so that your upper arms are parallel to the floor to the sides of your torso. Tip: Your forearms will be pointing forward since you are grabbing the handles. Once you bring the handles forward and extend the arms you will be at the starting position.\nNow bring the handles back towards you as you breathe in.\nPush the handles away from you as you flex your pecs and you breathe out. Hold the contraction for a second before going back to the starting position.\nRepeat for the recommended amount of reps.\nWhen finished step on the lever again and slowly get the handles back to their original place.",2],["Machine_Bicep_Curl","Machine Bicep Curl","Adjust the seat to the appropriate height and make your weight selection. Place your upper arms against the pads and grasp the handles. This will be your starting position.\nPerform the movement by flexing the elbow, pulling your lower arm towards your upper arm.\nPause at the top of the movement, and then slowly return the weight to the starting position.\nAvoid returning the weight all the way to the stops until the set is complete to keep tension on the muscles being worked.",2],["Machine_Preacher_Curls","Machine Preacher Curls","Sit down on the Preacher Curl Machine and select the weight.\nPlace the back of your upper arms (your triceps) on the preacher pad provided and grab the handles using an underhand grip (palms facing up). Tip: Make sure that when you place the arms on the pad you keep the elbows in. This will be your starting position.\nNow lift the handles as you exhale and you contract the biceps. At the top of the position make sure that you hold the contraction for a second. Tip: Only the forearms should move. The upper arms should remain stationary and on the pad at all times.\nLower the handles slowly back to the starting position as you inhale.\nRepeat for the recommended amount of repetitions.",2],["Machine_Triceps_Extension","Machine Triceps Extension","Adjust the seat to the appropriate height and make your weight selection. Place your upper arms against the pads and grasp the handles. This will be your starting position.\nPerform the movement by extending the elbow, pulling your lower arm away from your upper arm.\nPause at the completion of the movement, and then slowly return the weight to the starting position.\nAvoid returning the weight all the way to the stops until the set is complete to keep tension on the muscles being worked.",2],["Medicine_Ball_Chest_Pass","Medicine Ball Chest Pass","You will need a partner for this exercise. Lacking one, this movement can be performed against a wall.\nBegin facing your partner holding the medicine ball at your torso with both hands.\nPull the ball to your chest, and reverse the motion by extending through the elbows. For sports applications, you can take a step as you throw.\nYour partner should catch the ball, and throw it back to you.\nReceive the throw with both hands at chest height.",2],["Medicine_Ball_Scoop_Throw","Medicine Ball Scoop Throw","Assume a semisquat stance with a medicine ball in your hands. Your arms should hang so the ball is near your feet.\nBegin by thrusting the hips forward as you extend through the legs, jumping up.\nAs you do, swing your arms up and over your head, keeping them extended, releasing the ball at the peak of your movement. The goal is to throw the ball the greatest distance behind you.",2],["Monster_Walk","Monster Walk","Place a band around both ankles and another around both knees. There should be enough tension that they are tight when your feet are shoulder width apart.\nTo begin, take short steps forward alternating your left and right foot.\nAfter several steps, do just the opposite and walk backward to where you started.",2],["Mountain_Climbers","Mountain Climbers","Begin in a pushup position, with your weight supported by your hands and toes. Flexing the knee and hip, bring one leg until the knee is approximately under the hip. This will be your starting position.\nExplosively reverse the positions of your legs, extending the bent leg until the leg is straight and supported by the toe, and bringing the other foot up with the hip and knee flexed. Repeat in an alternating fashion for 20-30 seconds.",2],["Muscle_Snatch","Muscle Snatch","Begin with a loaded barbell held at the mid thigh position with a wide grip. The feet should be directly below the hips, with the feet turned out as needed. Lower the hips, with the chest up and the head looking forward. The shoulders should be just in front of the bar. This will be the starting position.\nBegin the pull by driving through the front of the heels, raising the bar. Transition into the second pull by extending through the hips knees and ankles, driving the bar up as quickly as possible. The bar should be close to the body.\nContinue raising the bar to the overhead position, without rebending the knees.",2],["Muscle_Up","Muscle Up","Grip the rings using a false grip, with the base of your palms on top of the rings. Initiate a pull up by pulling the elbows down to your side, flexing the elbows.\nAs you reach the top position of the pull-up, pull the rings to your armpits as you roll your shoulders forward, allowing your elbows to move straight back behind you. This puts you into the proper position to continue into the dip portion of the movement.\nMaintaining control and stability, extend through the elbow to complete the motion.\nUse care when lowering yourself to the ground.",2],["Narrow_Stance_Hack_Squats","Narrow Stance Hack Squats","Place the back of your torso against the back pad of the machine and hook your shoulders under the shoulder pads provided.\nPosition your legs in the platform using a less than shoulder width narrow stance with the toes slightly pointed out. Your feet should be around 3 inches or less apart. Tip: Keep your head up at all times and also maintain the back on the pad at all times.\nPlace your arms on the side handles of the machine and disengage the safety bars (which on most designs is done by moving the side handles from a facing front position to a diagonal position).\nNow straighten your legs without locking the knees. This will be your starting position.\nBegin to slowly lower the unit by bending the knees as you maintain a straight posture with the head up (back on the pad at all times). Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement.\nBegin to raise the unit as you exhale by pushing the floor with mainly with the heels of your feet as you straighten the legs again and go back to the starting position.\nRepeat for the recommended amount of repetitions.",2],["Narrow_Stance_Leg_Press","Narrow Stance Leg Press","Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a less-than-shoulder-width narrow stance with the toes slightly pointed out. Your feet should be around 3 inches or less apart. Tip: Keep your head up at all times and also maintain the back on the pad at all times.\nLower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.\nAs you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.\nPushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale.\nRepeat for the recommended amount of repetitions and ensure to lock the safety pins properly once you are done. You do not want that platform falling on you fully loaded.",2],["Oblique_Crunches","Oblique Crunches","Lie flat on the floor with your lower back pressed to the ground. For this exercise, you will need to put one hand beside your head and the other to the side against the floor.\nMake sure your feet are elevated and resting on a flat surface.\nNow lift the shoulder in which your hand is touching your head.\nSimply elevate your shoulder and body upward until you touch your knee. For example, if you have your right hand besides your head, then you want to elevate your body upwards until your right elbow touches your left knee. The same variation can be applied doing the inverse and using your left elbow to touch your right knee.\nAfter your knee touches your elbow, lower your body until you have reached the starting position.\nRemember to breathe in during the eccentric (lowering) part of the exercise and to breathe out during the concentric (upward) part of the exercise.\nContinue alternating in this manner until all of the recommended repetitions for each side have been completed.",2],["One-Arm_Dumbbell_Row","One-Arm Dumbbell Row","Choose a flat bench and place a dumbbell on each side of it.\nPlace the right leg on top of the end of the bench, bend your torso forward from the waist until your upper body is parallel to the floor, and place your right hand on the other end of the bench for support.\nUse the left hand to pick up the dumbbell on the floor and hold the weight while keeping your lower back straight. The palm of the hand should be facing your torso. This will be your starting position.\nPull the resistance straight up to the side of your chest, keeping your upper arm close to your side and keeping the torso stationary. Breathe out as you perform this step. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. Also, make sure that the force is performed with the back muscles and not the arms. Finally, the upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the dumbbell; therefore do not try to pull the dumbbell up using the forearms.\nLower the resistance straight down to the starting position. Breathe in as you perform this step.\nRepeat the movement for the specified amount of repetitions.\nSwitch sides and repeat again with the other arm.",2],["One-Arm_Kettlebell_Clean_and_Jerk","One-Arm Kettlebell Clean and Jerk","Hold a kettlebell by the handle.\nClean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so, so that the palm faces forward.\nDip your body by bending the knees, keeping your torso upright.\nImmediately reverse direction, driving through the heels, in essence jumping to create momentum. As you do so, press the kettlebell overhead to lockout by extending the arms, using your body's momentum to move the weight.\nReceive the weight overhead by returning to a squat position underneath the weight.\nKeeping the weight overhead, return to a standing position. Lower the weight to the floor to perform the next repetition.",2],["One-Arm_Kettlebell_Swings","One-Arm Kettlebell Swings","",2],["One-Arm_Overhead_Kettlebell_Squats","One-Arm Overhead Kettlebell Squats","Clean and press a kettlebell with one arm. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so. Press the weight overhead by extending through the elbow.This will be your starting position.\nLooking straight ahead and keeping a kettlebell locked out above you, flex the knees and hips and lower your torso between your legs, keeping your head and chest up.\nPause at the bottom position for a second before rising back to the top, driving through the heels of your feet.",2],["One-Legged_Cable_Kickback","One-Legged Cable Kickback","Hook a leather ankle cuff to a low cable pulley and then attach the cuff to your ankle.\nFace the weight stack from a distance of about two feet, grasping the steel frame for support.\nWhile keeping your knees and hips bent slightly and your abs tight, contract your glutes to slowly \"kick\" the working leg back in a semicircular arc as high as it will comfortably go as you breathe out. Tip: At full extension, squeeze your glutes for a second in order to achieve a peak contraction.\nNow slowly bring your working leg forward, resisting the pull of the cable until you reach the starting position.\nRepeat for the recommended amount of repetitions.\nSwitch legs and repeat the movement for the other side.",2],["One_Arm_Lat_Pulldown","One Arm Lat Pulldown","Select an appropriate weight and adjust the knee pad to help keep you down. Grasp the handle with a pronated grip. This will be your starting position.\nPull the handle down, squeezing your elbow to your side as you flex the elbow.\nPause at the bottom of the motion, and then slowly return the handle to the starting position.\nFor multiple repetitions, avoid completely returning the weight to keep tension on the muscles being worked.",2],["Overhead_Slam","Overhead Slam","Hold a medine ball with both hands and stand with your feet at shoulder width. This will be your starting position.\nInitiate the countermovement by raising the ball above your head and fully extending your body.\nReverse the motion, slamming the ball into the ground directly in front of you as hard as you can.\nReceive the ball with both hands on the bounce and repeat the movement.",2],["Overhead_Squat","Overhead Squat","Start out by having a barbell in front of you on the floor. Your feet should be wider than shoulder width apart from each other.\nBend the knees and use a pronated grip (palms facing you) to grab the barbell. Your hands should be at a wider than shoulder width apart from each other before lifting. Once you are positioned, lift the barbell up until you can rest it on your chest.\nMove the barbell over and slightly behind your head and make sure your arms are fully extended. Keep your head up at all times and also maintain a straight back. Retract your shoulder blades. This is your starting position.\nSlowly lower the weight by bending your knees until your thighs are parallel to the ground while inhaling. Tip: Keep your back straight while performing this exercise to avoid any injuries and your arms should remain extended and over your head at all times.\nNow use your feet and legs to help bring the weight back up to the starting position while exhaling.\nRepeat for the recommended amount of repetitions.",2],["Overhead_Stretch","Overhead Stretch","Standing straight up, lace your fingers together and open your palms to the ceiling. Keep your shoulders down as you extend your arms up.\nTo create a full torso stretch, pull your tailbone down and stabilize your torso as you do this. Stretch the muscles on both the front and the back of the torso.",2],["Pallof_Press","Pallof Press","Connect a standard handle to a tower, and—if possible—position the cable to shoulder height. If not, a low pulley will suffice.\nWith your side to the cable, grab the handle with both hands and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable.\nWith your feet positioned hip-width apart and knees slightly bent, hold the cable to the middle of your chest. This will be your starting position.\nPress the cable away from your chest, fully extending both arms. You core should be tight and engaged.\nHold the repetition for several seconds before returning to the starting position.\nAt the conclusion of the set, repeat facing the other direction.",2],["Pin_Presses","Pin Presses","Pin presses remove the eccentric phase of the bench press, developing starting strength. They also allow you to train a desired range of motion.\nThe bench should be set up in a power rack. Set the pins to the desired point in your range of motion, whether it just be lockout or an inch off of your chest. The bar should be moved to the pins and prepared for lifting.\nBegin by lying on the bench, with the bar directly above the contact point during your regular bench. Tuck your feet underneath you and arch your back. Using the bar to help support your weight, lift your shoulder off the bench and retract them, squeezing the shoulder blades together. Use your feet to drive your traps into the bench. Maintain this tight body position throughout the movement.\nYou can take a standard bench grip, or shoulder width to focus on the triceps. The bar, wrist, and elbow should stay in line at all times. Focus on squeezing the bar and trying to pull it apart.\nDrive the bar up with as much force as possible. The elbows should be tucked in until lockout.\nReturn the bar to the pins, pausing before beginning the next repetition.",2],["Plank","Plank","Get into a prone position on the floor, supporting your weight on your toes and your forearms. Your arms are bent and directly below the shoulder.\nKeep your body straight at all times, and hold this position as long as possible. To increase difficulty, an arm or leg can be raised.",2],["Plate_Pinch","Plate Pinch","Grab two wide-rimmed plates and put them together with the smooth sides facing outward\nUse your fingers to grip the outside part of the plate and your thumb for the other side thus holding both plates together. This is the starting position.\nSqueeze the plate with your fingers and thumb. Hold this position for as long as you can.\nRepeat for the recommended amount of sets prescribed in your program.\nSwitch arms and repeat the movements.",2],["Plyo_Kettlebell_Pushups","Plyo Kettlebell Pushups","Place a kettlebell on the floor. Place yourself in a pushup position, on your toes with one hand on the ground and one hand holding the kettlebell, with your elbows extended. This will be your starting position.\nBegin by lowering yourself as low as you can, keeping your back straight.\nQuickly and forcefully reverse direction, pushing yourself up to the other side of the kettlebell, switching hands as you do so. Continue the movement by descending and repeating the movement back and forth.",2],["Power_Clean","Power Clean","Stand with your feet slightly wider than shoulder width apart and toes pointing out slightly.\nSquat down and grasp bar with a closed, pronated grip. Your hands should be slightly wider than shoulder width apart outside knees with elbows fully extended.\nPlace the bar about 1 inch in front of your shins and over the balls of your feet.\nYour back should be flat or slightly arched, your chest held up and out and your shoulder blades should be retracted.\nKeep your head in a neutral position (in line with vertebral column and not tilted or rotated) with your eyes focused straight ahead. Inhale during this phase.\nLift the bar from the floor by forcefully extending the hips and the knees as you exhale. Tip: The upper torso should maintain the same angle. Do not bend at the waist yet and do not let the hips rise before the shoulders (this would have the effect of pushing the glutes in the air and stretching the hamstrings.\nKeep elbows fully extended with the head in a neutral position and the shoulders over the bar.\nAs the bar raises keep it as close to the shins as possible.\nAs the bar passes the knees, thrust your hips forward and slightly bend the knees to avoid locking them. Tip: At this point your thighs should be against the bar.\nKeep the back flat or slightly arched, elbows fully extended and your head neutral. Tip: You will hold your breath until the next phase.\nInhale and then forcefully and quickly extend your hips and knees and stand on your toes.\nKeep the bar as close to your body as possible. Tip: Your back should be flat with the elbows pointed out to the sides and your head in a neutral position. Also, keep your shoulders over the bar and arms straight as long as possible.\nWhen your lower body joints are fully extended, shrug the shoulders upward rapidly without letting the elbows flex yet. Exhale during this portion of the movement.\nAs the shoulders reach their highest elevation flex your elbows to begin pulling your body under the bar.\nContinue to pull the arms as high and as long as possible. Tip: Due to the explosive nature of this phase, your torso will be erect or with an arched back, your head will be tilted back slightly and your feet may lose contact with the floor.\nAfter the lower body has fully extended and the bar reaches near maximal height, pull your body under the bar and rotate the arms around and under the bar.\nSimultaneously, flex the hips and knees into a quarter squat position.\nOnce the arms are under the bar, inhale and then lift your elbows to position the upper arms parallel to the floor. Rack the bar across the front of your collar bones and front shoulder muscles.\nCatch the bar with an erect and tight torso, a neutral head position and flat feet. Exhale during this movement.\nStand up by extending the hips and knees to a fully erect position.\nLower the bar by gradually reducing the muscular tension of the arms to allow a controlled descent of the bar to the thighs. Inhale during this movement.\nSimultaneously flex the hips and knees to cushion the impact of the bar on the thighs.\nSquat down with the elbows fully extended until the bar touches the floor.\nStart over at Phase 1 and repeat for the recommended amount of repetitions.",2],["Power_Jerk","Power Jerk","Standing with the weight racked on the front of the shoulders, begin with the dip. With your feet directly under your hips, flex the knees without moving the hips backward. Go down only slightly, and reverse direction as powerfully as possible.\nDrive through the heels create as much speed and force as possible, and be sure to move your head out of the way as the bar leaves the shoulders.\nAt this moment as the feet leave the floor, the feet must be placed into the receiving position as quickly as possible. In the brief moment the feet are not actively driving against the platform, the athletes effort to push the bar up will drive them down. The feet should be moved to a slightly wider stance, with the knees partially bent.\nReceive the bar with the arms locked out overhead.\nReturn to a standing position.",2],["Power_Snatch","Power Snatch","Begin with a loaded barbell on the floor. The bar should be close to or touching the shins, and a wide grip should be taken on the bar. The feet should be directly below the hips, with the feet turned out as needed. Lower the hips, with the chest up and the head looking forward. The shoulders should be just in front of the bar. This will be the starting position.\nBegin the first pull by driving through the front of the heels, raising the bar from the ground. The back angle should stay the same until the bar passes the knees.\nTransition into the second pull by extending through the hips knees and ankles, driving the bar up as quickly as possible. The bar should be close to the body. At peak extension, shrug the shoulders and allow the elbows to flex to the side.\nAs you move your feet into the receiving position, a slightly wider position, pull yourself below the bar as you elevate the bar overhead. The bar should be received in a partial squat. Continue raising the bar to the overhead position, receiving the bar locked out overhead.\nReturn to a standing position with the weight over head.",2],["Preacher_Curl","Preacher Curl","To perform this movement you will need a preacher bench and an E-Z bar. Grab the E-Z curl bar at the close inner handle (either have someone hand you the bar which is preferable or grab the bar from the front bar rest provided by most preacher benches). The palm of your hands should be facing forward and they should be slightly tilted inwards due to the shape of the bar.\nWith the upper arms positioned against the preacher bench pad and the chest against it, hold the E-Z Curl Bar at shoulder length. This will be your starting position.\nAs you breathe in, slowly lower the bar until your upper arm is extended and the biceps is fully stretched.\nAs you exhale, use the biceps to curl the weight up until your biceps is fully contracted and the bar is at shoulder height. Squeeze the biceps hard and hold this position for a second.\nRepeat for the recommended amount of repetitions.",2],["Prowler_Sprint","Prowler Sprint","Place your sled on an appropriate surface, loaded to a suitable weight. The sled should provide enough resistance to require effort, but not so heavy that you are significantly slowed down.\nYou may use the upright or the low handles for this exercise. Place your hands on the handles with your arms extended, leaning into the implement.\nWith good posture, drive through the ground with alternating, short steps. Move as fast as you can for a short distance.",2],["Pull_Through","Pull Through","Begin standing a few feet in front of a low pulley with a rope or handle attached. Face away from the machine, straddling the cable, with your feet set wide apart.\nBegin the movement by reaching through your legs as far as possible, bending at the hips. Keep your knees slightly bent. Keeping your arms straight, extend through the hip to stand straight up. Avoid pulling upward through the shoulders; all of the motion should originate through the hips.",2],["Pullups","Pullups","Grab the pull-up bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.\nAs you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.\nPull your torso up until the bar touches your upper chest by drawing the shoulders and the upper arms down and back. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.\nAfter a second on the contracted position, start to inhale and slowly lower your torso back to the starting position when your arms are fully extended and the lats are fully stretched.\nRepeat this motion for the prescribed amount of repetitions.",2],["Push-Up_Wide","Push-Up Wide","With your hands wide apart, support your body on your toes and hands in a plank position. Your elbows should be extended and your body straight. Do not allow your hips to sag. This will be your starting position.\nTo begin, allow the elbows to flex, lowering your chest to the floor as you inhale.\nUsing your pectoral muscles, press your upper body back up to the starting position by extending the elbows. Exhale as you perform this step.\nAfter pausing at the contracted position, repeat the movement for the prescribed amount of repetitions.",2],["Push-Ups_With_Feet_On_An_Exercise_Ball","Push-Ups With Feet On An Exercise Ball","Lie on the floor face down and place your hands about 36 inches apart from each other holding your torso up at arms length.\nPlace your toes on top of an exercise ball. This will allow your body to be elevated.\nLower yourself until your chest almost touches the floor as you inhale.\nUsing your pectoral muscles, press your upper body back up to the starting position and squeeze your chest. Breathe out as you perform this step.\nAfter a second pause at the contracted position, repeat the movement for the prescribed amount of repetitions.",2],["Push_Press","Push Press","",2],["Push_Up_to_Side_Plank","Push Up to Side Plank","Get into pushup position on the toes with your hands just outside of shoulder width.\nPerform a pushup by allowing the elbows to flex. As you descend, keep your body straight.\nDo one pushup and as you come up, shift your weight on the left side of the body, twist to the side while bringing the right arm up towards the ceiling in a side plank.\nLower the arm back to the floor for another pushup and then twist to the other side.\nRepeat the series, alternating each side, for 10 or more reps.",2],["Pushups","Pushups","Lie on the floor face down and place your hands about 36 inches apart while holding your torso up at arms length.\nNext, lower yourself downward until your chest almost touches the floor as you inhale.\nNow breathe out and press your upper body back up to the starting position while squeezing your chest.\nAfter a brief pause at the top contracted position, you can begin to lower yourself downward again for as many repetitions as needed.",2],["Rack_Pull_with_Bands","Rack Pull with Bands","Set up in a power rack with the bar on the pins. The pins should be set to the desired point; just below the knees, just above, or in the mid thigh position. Attach bands to the base of the rack, or secure them with dumbbells. Attach the other end to the bar. You may need to choke the bands to provide tension.\nPosition yourself against the bar in proper deadlifting position. Your feet should be under your hips, your grip shoulder width, back arched, and hips back to engage the hamstrings. Since the weight is typically heavy, you may use a mixed grip, a hook grip, or use straps to aid in holding the weight.\nWith your head looking forward, extend through the hips and knees, pulling the weight up and back until lockout. Be sure to pull your shoulders back as you complete the movement. Return the weight to the pins and repeat.",2],["Recumbent_Bike","Recumbent Bike","To begin, seat yourself on the bike and adjust the seat to your height.\nSelect the desired option from the menu. You may have to start pedaling to turn it on. You can use the manual setting, or you can select a program to use. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. The level of resistance can be changed throughout the workout. The handles can be used to monitor your heart rate to help you stay at an appropriate intensity.\nRecumbent bikes offer convenience, cardiovascular benefits, and have less impact than other activities. A 150 lb person will burn about 230 calories cycling at a moderate rate for 30 minutes, compared to 450 calories or more running.",2],["Reverse_Band_Bench_Press","Reverse Band Bench Press","Position a bench inside a power rack, with the bar set to the correct height. Begin by anchoring bands either to band pegs or to the top of the rack. Ensure that you will be position properly under the bands. Attach the other end to the barbell.\nLie on the bench, tuck your feet underneath you and arch your back. Using the bar to help support your weight, lift your shoulder off the bench and retract them, squeezing the shoulder blades together. Use your feet to drive your traps into the bench. Maintain this tight body position throughout the movement. However wide your grip, it should cover the ring on the bar.\nPull the bar out of the rack without protracting your shoulders. Focus on squeezing the bar and trying to pull it apart. Lower the bar to your lower chest or upper stomach. The bar, wrist, and elbow should stay in line at all times.\nPause when the barbell touches your torso, and then drive the bar up with as much force as possible. The elbows should be tucked in until lockout.",2],["Reverse_Barbell_Preacher_Curls","Reverse Barbell Preacher Curls","Grab an EZ-bar using a shoulder width and palms down (pronated) grip.\nNow place the upper part of both arms on top of the preacher bench and have your arms extended. This will be your starting position.\nAs you exhale, use the biceps to curl the weight up until your biceps are fully contracted and the barbell is at shoulder height. Squeeze the biceps hard for a second at the contracted position.\nAs you breathe in, slowly lower the barbell until your upper arms are extended and the biceps is fully stretched.\nRepeat for the recommended amount of repetitions.",2],["Reverse_Cable_Curl","Reverse Cable Curl","Stand up with your torso upright while holding a bar attachment that is attached to a low pulley using a pronated (palms down) and shoulder width grip. Make sure also that you keep the elbows close to the torso. This will be your starting position.\nWhile holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.\nSlowly begin to bring the bar back to starting position as your breathe in.\nRepeat for the recommended amount of repetitions.",2],["Reverse_Crunch","Reverse Crunch","Lie down on the floor with your legs fully extended and arms to the side of your torso with the palms on the floor. Your arms should be stationary for the entire exercise.\nMove your legs up so that your thighs are perpendicular to the floor and feet are together and parallel to the floor. This is the starting position.\nWhile inhaling, move your legs towards the torso as you roll your pelvis backwards and you raise your hips off the floor. At the end of this movement your knees will be touching your chest.\nHold the contraction for a second and move your legs back to the starting position while exhaling.\nRepeat for the recommended amount of repetitions.",2],["Reverse_Hyperextension","Reverse Hyperextension","Place your feet between the pads after loading an appropriate weight. Lay on the top pad, allowing your hips to hang off the back, while grasping the handles to hold your position.\nTo begin the movement, flex the hips, pulling the legs forward.\nReverse the motion by extending the hips, kicking the leg back. It is very important not to over-extend the hip on this movement, stopping short of your full range of motion.\nReturn by again flexing the hip, pulling the carriage forward as far as you can.\nRepeat for the desired number of repetitions.",2],["Reverse_Machine_Flyes","Reverse Machine Flyes","Adjust the handles so that they are fully to the rear. Make an appropriate weight selection and adjust the seat height so the handles are at shoulder level. Grasp the handles with your hands facing inwards. This will be your starting position.\nIn a semicircular motion, pull your hands out to your side and back, contracting your rear delts.\nKeep your arms slightly bent throughout the movement, with all of the motion occurring at the shoulder joint.\nPause at the rear of the movement, and slowly return the weight to the starting position.",2],["Rickshaw_Carry","Rickshaw Carry","Position the frame at the starting point, and load with the appropriate weight. Standing in the center of the frame, begin by gripping the handles and driving through your heels to lift the frame. Ensure your chest and head are up and your back is straight.\nImmediately begin walking briskly with quick, controlled steps. Keep your chest up and head forward, and make sure you continue breathing. Bring the frame to the ground after you have reached the end point.",2],["Ring_Dips","Ring Dips","Grip a ring in each hand, and then take a small jump to help you get into the starting position with your arms locked out.\nBegin by flexing the elbow, lowering your body until your arms break 90 degrees. Avoid swinging, and maintain good posture throughout the descent.\nReverse the motion by extending the elbow, pushing yourself back up into the starting position.\nRepeat for the desired number of repetitions.",2],["Romanian_Deadlift","Romanian Deadlift","Put a barbell in front of you on the ground and grab it using a pronated (palms facing down) grip that a little wider than shoulder width. Tip: Depending on the weight used, you may need wrist wraps to perform the exercise and also a raised platform in order to allow for better range of motion.\nBend the knees slightly and keep the shins vertical, hips back and back straight. This will be your starting position.\nKeeping your back and arms completely straight at all times, use your hips to lift the bar as you exhale. Tip: The movement should not be fast but steady and under control.\nOnce you are standing completely straight up, lower the bar by pushing the hips back, only slightly bending the knees, unlike when squatting. Tip: Take a deep breath at the start of the movement and keep your chest up. Hold your breath as you lower and exhale as you complete the movement.\nRepeat for the recommended amount of repetitions.",2],["Romanian_Deadlift_from_Deficit","Romanian Deadlift from Deficit","Begin standing while holding a bar at arm's length in front of you. You can stand on a raised platform to increase the range of motion.\nBegin by flexing the knees slightly, and then flex at the hip, moving your butt back as far as possible, lowering the torso as far as flexibility allows. The back should remain in absolute extension at all times, and the bar should remain in contact with the legs. If done properly, there should be heavy tension felt in the hamstrings.\nReverse the motion to return to the starting position.",2],["Rope_Jumping","Rope Jumping","Hold an end of the rope in each hand. Position the rope behind you on the ground. Raise your arms up and turn the rope over your head bringing it down in front of you. When it reaches the ground, jump over it. Find a good turning pace that can be maintained. Different speeds and techniques can be used to introduce variation.\nRope jumping is exciting, challenges your coordination, and requires a lot of energy. A 150 lb person will burn about 350 calories jumping rope for 30 minutes, compared to over 450 calories running.",2],["Rope_Straight-Arm_Pulldown","Rope Straight-Arm Pulldown","Attach a rope to a high pulley and make your weight selection. Stand a couple feet back from the pulley with your feet staggered and take the rope with both hands. Lean forward from the hip, keeping your back straight, with your arms extended up in front of you. This will be your starting position.\nKeeping your arms straight, extend the shoulder to pull the rope down to your thighs.\nPause at the bottom of the motion, squeezing your lats.\nReturn to the starting position without allowing the weight to fully rest on the stack.",2],["Rowing_Stationary","Rowing, Stationary","To begin, seat yourself on the rower. Make sure that your heels are resting comfortably against the base of the foot pedals and that the straps are secured. Select the program that you wish to use, if applicable. Sit up straight and bend forward at the hips.\nThere are three phases of movement when using a rower. The first phase is when you come forward on the rower. Your knees are bent and against your chest. Your upper body is leaning slightly forward while still maintaining good posture. Next, push against the foot pedals and extend your legs while bringing your hands to your upper abdominal area, squeezing your shoulders back as you do so. To avoid straining your back, use primarily your leg and hip muscles.\nThe recovery phase simply involves straightening your arms, bending the knees, and bringing your body forward again as you transition back into the first phase.",2],["Russian_Twist","Russian Twist","Lie down on the floor placing your feet either under something that will not move or by having a partner hold them. Your legs should be bent at the knees.\nElevate your upper body so that it creates an imaginary V-shape with your thighs. Your arms should be fully extended in front of you perpendicular to your torso and with the hands clasped. This is the starting position.\nTwist your torso to the right side until your arms are parallel with the floor while breathing out.\nHold the contraction for a second and move back to the starting position while breathing out. Now move to the opposite side performing the same techniques you applied to the right side.\nRepeat for the recommended amount of repetitions.",2],["Scapular_Pull-Up","Scapular Pull-Up","Take a pronated grip on a pull-up bar.\nFrom a hanging position, raise yourself a few inches without using your arms. Do this by depressing your shoulder girdle in a reverse shrugging motion.\nPause at the completion of the movement, and then slowly return to the starting position before performing more repetitions.",2],["Scissor_Kick","Scissor Kick","To begin, lie down with your back pressed against the floor or on an exercise mat (optional). Your arms should be fully extended to the sides with your palms facing down. Note: The arms should be stationary the entire time.\nWith a slight bend at the knees, lift your legs up so that your heels are about 6 inches off the ground. This is the starting position.\nNow lift your left leg up to about a 45 degree angle while your right leg is lowered until the heel is about 2-3 inches from the ground.\nSwitch movements by raising your right leg up and lowering your left leg. Remember to breathe while performing this exercise.\nRepeat for the recommended amount of repetitions.",2],["Seated_Barbell_Military_Press","Seated Barbell Military Press","Sit on a Military Press Bench with a bar behind your head and either have a spotter give you the bar (better on the rotator cuff this way) or pick it up yourself carefully with a pronated grip (palms facing forward). Tip: Your grip should be wider than shoulder width and it should create a 90-degree angle between the forearm and the upper arm as the barbell goes down.\nOnce you pick up the barbell with the correct grip length, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.\nLower the bar down to the collarbone slowly as you inhale.\nLift the bar back up to the starting position as you exhale.\nRepeat for the recommended amount of repetitions.",2],["Seated_Cable_Rows","Seated Cable Rows","For this exercise you will need access to a low pulley row machine with a V-bar. Note: The V-bar will enable you to have a neutral grip where the palms of your hands face each other. To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.\nLean over as you keep the natural alignment of your back and grab the V-bar handles.\nWith your arms extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lats as you hold the bar in front of you. This is the starting position of the exercise.\nKeeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it until you touch the abdominals. Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard. Hold that contraction for a second and slowly go back to the original position while breathing in.\nRepeat for the recommended amount of repetitions.",2],["Seated_Calf_Raise","Seated Calf Raise","Sit on the machine and place your toes on the lower portion of the platform provided with the heels extending off. Choose the toe positioning of your choice (forward, in, or out) as per the beginning of this chapter.\nPlace your lower thighs under the lever pad, which will need to be adjusted according to the height of your thighs. Now place your hands on top of the lever pad in order to prevent it from slipping forward.\nLift the lever slightly by pushing your heels up and release the safety bar. This will be your starting position.\nSlowly lower your heels by bending at the ankles until the calves are fully stretched. Inhale as you perform this movement.\nRaise the heels by extending the ankles as high as possible as you contract the calves and breathe out. Hold the top contraction for a second.\nRepeat for the recommended amount of repetitions.",2],["Seated_Dumbbell_Curl","Seated Dumbbell Curl","Sit on a flat bench with a dumbbell on each hand being held at arms length. The elbows should be close to the torso.\nRotate the palms of the hands so that they are facing your torso. This will be your starting position.\nWhile holding the upper arm stationary, curl the weights and start twisting the wrists once the dumbbells pass your thighs so that the palms of your hands face forward at the end of the movement. Make sure that you contract the biceps as you breathe out and make sure that only the forearms move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps.\nSlowly begin to bring the dumbbells back to the starting position as your breathe in and as you rotate the wrists back to a neutral grip.\nRepeat for the recommended amount of repetitions.",2],["Seated_Dumbbell_Palms-Up_Wrist_Curl","Seated Dumbbell Palms-Up Wrist Curl","Start out by placing two dumbbells on the floor in front of a flat bench.\nSit down on the edge of the flat bench with your legs at about shoulder width apart. Make sure to keep your feet on the floor.\nUse your arms to grab both of the dumbbells and bring them up so that your forearms are resting against your thighs with the palms of the hands facing up. Your wrists should be hanging over the edge of your thighs.\nStart out by curling your wrist upwards and exhaling.\nSlowly lower your wrists back down to the starting position while inhaling. Make sure to inhale during this part of the exercise. Tip: Your forearms should be stationary as your wrist is the only movement needed to perform this exercise.\nRepeat for the recommended amount of repetitions.\nWhen finished, simply lower the dumbbells to the floor.",2],["Seated_Leg_Curl","Seated Leg Curl","Adjust the machine lever to fit your height and sit on the machine with your back against the back support pad.\nPlace the back of lower leg on top of padded lever (just a few inches under the calves) and secure the lap pad against your thighs, just above the knees. Then grasp the side handles on the machine as you point your toes straight (or you can also use any of the other two stances) and ensure that the legs are fully straight right in front of you. This will be your starting position.\nAs you exhale, pull the machine lever as far as possible to the back of your thighs by flexing at the knees. Keep your torso stationary at all times. Hold the contracted position for a second.\nSlowly return to the starting position as you breathe in.\nRepeat for the recommended amount of repetitions.",2],["Seated_Palms-Down_Barbell_Wrist_Curl","Seated Palms-Down Barbell Wrist Curl","Hold a barbell with both hands and your palms facing down; hands spaced about shoulder width.\nPlace your feet flat on the floor, at a distance that is slightly wider than shoulder width apart.\nLean forward and place your forearms on top of your upper thighs with your palms down. Tip: Make sure that the back of the wrists lay on top of your knees. This will be your starting position.\nLower the bar as far as possible while inhaling and keeping a tight grip.\nNow curl bar up as high as possible while flexing the forearms and exhaling. Hold the contraction at the top for a second and Tip: Only the wrist should move.",2],["Seated_Side_Lateral_Raise","Seated Side Lateral Raise","Pick a couple of dumbbells and sit at the end of a flat bench with your feet firmly on the floor. Hold the dumbbells with your palms facing in and your arms straight down at your sides at arms' length. This will be your starting position.\nWhile maintaining the torso stationary (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.\nLower the dumbbells back down slowly to the starting position as you inhale.\nRepeat for the recommended amount of repetitions.",2],["See-Saw_Press_Alternating_Side_Press","See-Saw Press (Alternating Side Press)","Grab a dumbbell with each hand and stand up erect.\nClean (lift) the dumbbells to the chest/shoulder level and then rotate your wrists so that your palms are facing towards you as if you were getting ready to perform an Arnold Press. This will be your starting position.\nNow start extending your left arm overhead as you rotate the wrist so that the palm of your hand faces forward as you go up. Your elbows should come out also as you lift the weight. Simultaneously, you will also be bending from your hip to your opposite side. Tip: If you perform the exercise correctly, is should look as if you are trying to reach for something overhead on the right hand side of your body, but with your left arm. Breathe out as you perform this movement.\nOnce you reach the top position breathe in. Then, with the weight fully extended overhead and you bent over to your right hand side, begin the movement to the left side.\nRepeat for the recommended amount of repetitions.",2],["Shotgun_Row","Shotgun Row","Attach a single handle to a low cable.\nAfter selecting the correct weight, stand a couple feet back with a wide-split stance. Your arm should be extended and your shoulder forward. This will be your starting position.\nPerform the movement by retracting the shoulder and flexing the elbow. As you pull, supinate the wrist, turning the palm upward as you go.\nAfter a brief pause, return to the starting position.",2],["Shoulder_Press_-_With_Bands","Shoulder Press - With Bands","To begin, stand on an exercise band so that tension begins at arm's length. Grasp the handles and lift them so that the hands are at shoulder height at each side.\nRotate the wrists so that the palms of your hands are facing forward. Your elbows should be bent, with the upper arms and forearms in line to the torso. This is your starting position.\nAs you exhale, lift the handles up until your arms are fully extended overhead.",2],["Shoulder_Stretch","Shoulder Stretch","Reach your left arm across your body and hold it straight.",2],["Side_Jackknife","Side Jackknife","",2],["Side_Lateral_Raise","Side Lateral Raise","Pick a couple of dumbbells and stand with a straight torso and the dumbbells by your side at arms length with the palms of the hand facing you. This will be your starting position.\nWhile maintaining the torso in a stationary position (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.\nLower the dumbbells back down slowly to the starting position as you inhale.\nRepeat for the recommended amount of repetitions.",2],["Side_Laterals_to_Front_Raise","Side Laterals to Front Raise","In a standing position, hold a pair of dumbbells at your side. This will be your starting position.\nKeeping your elbows slightly bent, raise the weights directly in front of you to shoulder height, avoiding any swinging or cheating.\nAt the top of the exercise move the weights out in front of you, keeping your arms extended.\nLower the weights with a controlled motion.\nOn the next repetition, raise the weights in front of you to shoulder height before moving the weights laterally to your sides.\nLower the weights to the starting position.",2],["Side_Neck_Stretch","Side Neck Stretch","Start with your shoulders relaxed, gently tilt your head towards your shoulder.\nAssist stretch with a gentle pull on the side of the head.",2],["Single-Arm_Cable_Crossover","Single-Arm Cable Crossover","Begin by moving the pulleys to the high position, select the resistance to be used, and take a handle in each hand.\nStep forward in front of both pulleys with your arms extended in front of you, bringing your hands together. Your head and chest should be up as you lean forward, while your feet should be staggered. This will be your starting position.\nKeeping your left arm in place, allow your right arm to extend out to the side, maintaining a slight bend at the elbow. The right arm should be perpendicular to the body at approximately shoulder level.\nReturn your arm back to the starting position by pulling your hand back to the midline of the body.\nHold for a second at the starting position and repeat the movement on the opposite side. Continue alternating back and forth for the prescribed number of repetitions.",2],["Single-Arm_Push-Up","Single-Arm Push-Up","Begin laying prone on the ground. Move yourself into a position supporting your weight on your toes and one arm. Your working arm should be placed directly under the shoulder, fully extended. Your legs should be extended, and for this movement you may need a wider base, placing your feet further apart than in a normal push-up.\nMaintain good posture, and place your free hand behind your back. This will be your starting position.\nLower yourself by allowing the elbow to flex until you touch the ground.\nDescend slowly, and reverse direction be extending the arm to return to the starting position.",2],["Single-Leg_High_Box_Squat","Single-Leg High Box Squat","Position a box in a rack. Secure a band or rope in place above the box.\nStanding in front of it, step onto the box to a full standing position, letting your other leg remain unsupported. Hold onto the band for balance\n. Continue stepping up and down on the same leg before switching to the opposite side.",2],["Single-Leg_Leg_Extension","Single-Leg Leg Extension
